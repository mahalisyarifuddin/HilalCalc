<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>MABBIMS Hijri Calendar</title>
		<style>
		/* =====================================================================
		   SHARED DESIGN CORE — identical in every app. Do not edit in place.
		   Edit /core.css, then run sync_core.py to push it to all apps.

		   Order: 1) tokens  2) reset/base  3) app shell  4) components.
		   App-specific rules go in the APP-SPECIFIC block below this one, so
		   they win on equal specificity without needing !important.
		   ===================================================================== */

		/* ---------- 1. Tokens: light (default) ----------
		   Style against these, never raw hex: every token has a dark twin, so
		   anything built from them themes itself for free. */
		:root {
			/* brand */
			--primary: #005dac;
			--on-primary: #ffffff;
			--hover: #00539a;
			--primary-container: #d4e3ff;
			--on-primary-container: #001c3a;

			/* surfaces */
			--background: #f9f9ff;
			--surface: #ffffff;
			--surface-variant: #f2f3fc;
			--muted: #f2f3fc;

			/* text */
			--text: #181c21;
			--text-muted: #5a6069;
			--text-secondary: #5a6069;

			/* lines */
			--border: #c1c6d4;
			--border-strong: #8f95a3;

			/* status */
			--success: #0b6b1d;
			--on-success: #ffffff;
			--success-bg: #d7f5d8;
			--danger: #ba1a1a;
			--error: #ba1a1a;
			--on-danger: #ffffff;
			--danger-bg: #ffdad6;
			--warning: #8a5000;
			--on-warning: #ffffff;
			--warning-bg: #ffedd5;
			--warning-text: #9a3412;
			--accent: #f57c00;
			--accent-bg: #fff8f0;
			--highlight-bg: #d4e3ff;

			/* elevation */
			--shadow-1: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .08);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .12);
			--scrim: rgba(0, 0, 0, .38);

			/* shape */
			--radius-sm: 4px;
			--radius: 8px;
			--radius-lg: 12px;
			--radius-pill: 999px;

			/* spacing scale */
			--sp-1: .25rem;
			--sp-2: .5rem;
			--sp-3: .75rem;
			--sp-4: 1rem;
			--sp-5: 1.5rem;
			--sp-6: 2rem;

			/* type */
			--font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

			/* layout — each app overrides this with its tier:
		   720 single-column · 960 standard · 1200 wide · 1600 dense/two-rail */
			--content-max: 960px;

			/* controls */
			--control-h: 42px;
		}

		/* ---------- 1b. Tokens: dark ----------
		   Duplicated on purpose: the media query serves "auto", the .dark class
		   serves an explicit choice. Change a value here and in .dark together. */
		@media (prefers-color-scheme: dark) {
			:root:not(.light) {
				--primary: #a5c8ff;
				--on-primary: #00315f;
				--hover: #72adff;
				--primary-container: #00468a;
				--on-primary-container: #d4e3ff;

				--background: #101319;
				--surface: #0b0e14;
				--surface-variant: #181c21;
				--muted: #181c21;

				--text: #e0e2ea;
				--text-muted: #a9b0bd;
				--text-secondary: #a9b0bd;

				--border: #414752;
				--border-strong: #6b7280;

				--success: #82db7e;
				--on-success: #00390a;
				--success-bg: #0b2a10;
				--danger: #ffb4ab;
				--error: #ffb4ab;
				--on-danger: #93000a;
				--danger-bg: #3b0907;
				--warning: #ffb95c;
				--on-warning: #3d2600;
				--warning-bg: #2b1c00;
				--warning-text: #ffd8a8;
				--accent: #ffb95c;
				--accent-bg: #1f1600;
				--highlight-bg: #001c3a;

				--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
				--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
				--scrim: rgba(0, 0, 0, .6);
			}
		}

		:root.dark {
			--primary: #a5c8ff;
			--on-primary: #00315f;
			--hover: #72adff;
			--primary-container: #00468a;
			--on-primary-container: #d4e3ff;

			--background: #101319;
			--surface: #0b0e14;
			--surface-variant: #181c21;
			--muted: #181c21;

			--text: #e0e2ea;
			--text-muted: #a9b0bd;
			--text-secondary: #a9b0bd;

			--border: #414752;
			--border-strong: #6b7280;

			--success: #82db7e;
			--on-success: #00390a;
			--success-bg: #0b2a10;
			--danger: #ffb4ab;
			--error: #ffb4ab;
			--on-danger: #93000a;
			--danger-bg: #3b0907;
			--warning: #ffb95c;
			--on-warning: #3d2600;
			--warning-bg: #2b1c00;
			--warning-text: #ffd8a8;
			--accent: #ffb95c;
			--accent-bg: #1f1600;
			--highlight-bg: #001c3a;

			--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
			--scrim: rgba(0, 0, 0, .6);
		}

		/* ---------- 2. Reset & base ----------
		   Headings are wrapped in :where() so they carry zero specificity — an
		   app can restyle h2 with a bare `h2 { }` and win. */
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html {
			-webkit-text-size-adjust: 100%;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: var(--font-sans);
			font-size: 1rem;
			line-height: 1.5;
			min-height: 100vh;
			min-height: 100dvh;
			padding: var(--sp-5) var(--sp-4);
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			-webkit-font-smoothing: antialiased;
		}

		:where(h1, h2, h3, h4, h5, h6) {
			line-height: 1.25;
			font-weight: 600;
			text-wrap: balance;
		}

		:where(h1) { font-size: 1.5rem; }
		:where(h2) { font-size: 1.125rem; }
		:where(h3) { font-size: 1rem; }
		:where(h4, h5, h6) { font-size: .9375rem; }

		a {
			color: var(--primary);
			text-decoration-thickness: 1px;
			text-underline-offset: 2px;
		}

		:focus-visible {
			outline: 2px solid var(--primary);
			outline-offset: 2px;
			border-radius: var(--radius-sm);
		}

		::selection {
			background: var(--primary-container);
			color: var(--on-primary-container);
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: .01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .01ms !important;
				scroll-behavior: auto !important;
			}
		}

		/* ---------- 3. App shell ----------
		   Header and main share --content-max, so every app lines up on the same
		   optical column whatever its width tier.

		   No page footer exists here, on purpose. Decorative footers (app name,
		   source link, "runs in your browser") are omitted; anything genuinely
		   useful goes in a .disclosure at the end of .app-main. */
		.app-header,
		.app-main {
			width: 100%;
			max-width: var(--content-max);
			margin-inline: auto;
		}

		.app-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: var(--sp-4);
			flex-wrap: wrap;
		}

		.app-title-group {
			flex: 1 1 16rem;
			display: flex;
			flex-direction: column;
			gap: var(--sp-1);
			min-width: 0;
		}

		.app-title-group h1 {
			font-size: 1.5rem;
			letter-spacing: -.01em;
		}

		.app-subtitle {
			color: var(--text-muted);
			font-size: .9375rem;
			max-width: 68ch;
		}

		.app-controls {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			flex-shrink: 0;
		}

		.app-main {
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			flex: 1;
		}

		/* ---------- 4. Components ---------- */

		/* The one surface primitive: every panel is a .card. Add .card-subtle
		   for a nested block that must read as *inside* another card. */
		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-5);
			min-width: 0;
		}

		.card > h2,
		.card-title {
			font-size: 1.125rem;
			margin-bottom: var(--sp-4);
		}

		.card-subtle {
			background: var(--surface-variant);
		}

		/* Buttons. The bare <button> element is the primary action, so most
		   markup needs no class. Add .secondary (outline), .danger, .ghost, or
		   .btn-icon (square, icon-only). Keep one primary per view. */
		button,
		.btn {
			font: inherit;
			font-weight: 500;
			line-height: 1.2;
			background: var(--primary);
			color: var(--on-primary);
			border: 1px solid transparent;
			border-radius: var(--radius);
			padding: 0 var(--sp-4);
			min-height: var(--control-h);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: var(--sp-2);
			cursor: pointer;
			transition: background-color .15s, border-color .15s, color .15s;
		}

		button:hover,
		.btn:hover {
			background: var(--hover);
		}

		button:disabled,
		.btn:disabled {
			opacity: .5;
			cursor: not-allowed;
		}

		button.secondary,
		.btn-secondary {
			background: transparent;
			color: var(--primary);
			border-color: var(--border);
		}

		button.secondary:hover,
		.btn-secondary:hover {
			background: var(--surface-variant);
		}

		button.danger,
		.btn-danger {
			background: var(--danger);
			color: var(--on-danger);
		}

		button.danger:hover,
		.btn-danger:hover {
			filter: brightness(.92);
			background: var(--danger);
		}

		button.ghost,
		.btn-ghost {
			background: transparent;
			color: var(--text);
			border-color: transparent;
		}

		button.ghost:hover,
		.btn-ghost:hover {
			background: var(--surface-variant);
		}

		/* Square icon-only button — the Settings trigger and every dialog close.
		   Apps that make buttons full width must exclude it; see the
		   :not(:where(.btn-icon)) pattern in generator / OpenDensityTool. */
		.btn-icon {
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			width: var(--control-h);
			min-height: var(--control-h);
			padding: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.btn-icon:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.btn-icon svg {
			width: 20px;
			height: 20px;
			display: block;
		}

		/* Form controls. Inputs, selects and textareas are full width by design:
		   width is controlled by the .field / .row wrapper, not the control. */
		label {
			display: block;
			font-size: .875rem;
			font-weight: 500;
			color: var(--text);
			margin-bottom: var(--sp-1);
		}

		input,
		select,
		textarea {
			font: inherit;
			color: var(--text);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-2) var(--sp-3);
			min-height: var(--control-h);
			width: 100%;
			max-width: 100%;
		}

		select {
			cursor: pointer;
			appearance: none;
			padding-right: 2rem;
			background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
				linear-gradient(135deg, currentColor 50%, transparent 50%);
			background-position: right 1.05rem center, right .8rem center;
			background-size: .3rem .3rem, .3rem .3rem;
			background-repeat: no-repeat;
		}

		textarea {
			min-height: 7rem;
			resize: vertical;
			line-height: 1.5;
		}

		input:hover,
		select:hover,
		textarea:hover {
			border-color: var(--border-strong);
		}

		input:focus,
		select:focus,
		textarea:focus {
			border-color: var(--primary);
		}

		input[type="checkbox"],
		input[type="radio"] {
			width: 1.125rem;
			height: 1.125rem;
			min-height: 0;
			accent-color: var(--primary);
			cursor: pointer;
			flex-shrink: 0;
		}

		input[type="range"] {
			padding: 0;
			min-height: 0;
			border: 0;
			background: transparent;
			accent-color: var(--primary);
		}

		input[type="color"] {
			padding: var(--sp-1);
			cursor: pointer;
		}

		input[type="file"] {
			padding: var(--sp-2);
		}

		input:disabled,
		select:disabled,
		textarea:disabled {
			background: var(--surface-variant);
			color: var(--text-muted);
			cursor: not-allowed;
		}

		/* Form layout. .field stacks one label + control; .row places fields side
		   by side. Set the column count on the row itself — style="--cols:3" —
		   and the responsive rules at the bottom handle the collapse. */
		.field {
			display: flex;
			flex-direction: column;
			min-width: 0;
			flex: 1;
		}

		.row {
			display: grid;
			grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
			gap: var(--sp-4);
			align-items: start;
		}

		.row-flex {
			display: flex;
			flex-wrap: wrap;
			gap: var(--sp-3);
			align-items: center;
		}

		.check {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			font-weight: 400;
			margin-bottom: 0;
			cursor: pointer;
		}

		.hint {
			color: var(--text-muted);
			font-size: .8125rem;
			margin-top: var(--sp-1);
		}

		/* Tabs. Mark the active one with .active AND aria-selected="true" so
		   assistive tech and the styling never disagree. */
		.tabs {
			display: flex;
			gap: var(--sp-1);
			border-bottom: 1px solid var(--border);
			overflow-x: auto;
			scrollbar-width: none;
		}

		.tabs::-webkit-scrollbar {
			display: none;
		}

		.tab {
			background: transparent;
			color: var(--text-muted);
			border: 0;
			border-bottom: 2px solid transparent;
			border-radius: var(--radius-sm) var(--radius-sm) 0 0;
			padding: 0 var(--sp-4);
			white-space: nowrap;
		}

		.tab:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.tab.active {
			color: var(--primary);
			border-bottom-color: var(--primary);
			background: transparent;
		}

		/* Tables. Cells never wrap; wrap the table in .table-wrap so wide data
		   scrolls sideways instead of bursting the card. */
		.table-wrap {
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-variant-numeric: tabular-nums;
		}

		th,
		td {
			text-align: left;
			padding: var(--sp-2) var(--sp-3);
			border-bottom: 1px solid var(--border);
			white-space: nowrap;
		}

		th {
			font-size: .8125rem;
			font-weight: 600;
			color: var(--text-muted);
			background: var(--surface-variant);
			position: sticky;
			top: 0;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		/* Small status pills. Use the semantic variant, not a colour name, so
		   meaning survives a palette change. */
		.badge {
			display: inline-flex;
			align-items: center;
			gap: var(--sp-1);
			font-size: .75rem;
			font-weight: 600;
			padding: var(--sp-1) var(--sp-2);
			border-radius: var(--radius-pill);
			background: var(--surface-variant);
			color: var(--text-muted);
			white-space: nowrap;
		}

		.badge-success { background: var(--success-bg); color: var(--success); }
		.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
		.badge-warning { background: var(--warning-bg); color: var(--warning-text); }

		/* Block-level callouts for explanation or warning. For secondary detail
		   nobody needs up front, prefer .disclosure below. */
		.notice {
			border: 1px solid var(--border);
			border-left: 3px solid var(--primary);
			background: var(--surface-variant);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
			font-size: .875rem;
		}

		.notice-warning { border-left-color: var(--accent); background: var(--warning-bg); color: var(--warning-text); }
		.notice-danger  { border-left-color: var(--danger); background: var(--danger-bg);  color: var(--danger); }

		/* ---------- Disclosure ----------
		   Where methodology, references and shortcuts live. Collapsed by default
		   so it never competes with the tool. This replaces the page footer —
		   if there is nothing worth reading, omit the block entirely. */
		.disclosure {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
		}

		.disclosure > summary {
			cursor: pointer;
			font-size: .875rem;
			font-weight: 600;
			color: var(--text-muted);
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			list-style: none;
			user-select: none;
		}

		.disclosure > summary::-webkit-details-marker { display: none; }

		.disclosure > summary::before {
			content: "";
			width: 0;
			height: 0;
			border-left: 5px solid currentColor;
			border-top: 4px solid transparent;
			border-bottom: 4px solid transparent;
			transition: transform .2s;
			flex-shrink: 0;
		}

		.disclosure[open] > summary::before { transform: rotate(90deg); }
		.disclosure > summary:hover { color: var(--primary); }
		.disclosure[open] > summary { margin-bottom: var(--sp-3); }

		.disclosure-body {
			font-size: .875rem;
			line-height: 1.7;
			color: var(--text-muted);
		}

		.disclosure-body > * + * { margin-top: var(--sp-3); }

		.disclosure-body ul,
		.disclosure-body ol { padding-left: 1.25rem; }

		.disclosure-body li + li { margin-top: var(--sp-1); }

		.disclosure-body pre,
		.disclosure-body code {
			font-family: var(--font-mono);
			font-size: .8125rem;
		}

		.disclosure-body pre {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: var(--sp-3);
			white-space: pre-wrap;
			overflow-x: auto;
		}

		/* ---------- Settings dialog ----------
		   Every app has one, opened by the header's .btn-icon. Structure is
		   .sheet-header / .sheet-body / .sheet-footer; only the body scrolls.
		   Open and close it via AppSettings.wireSheet, never showModal directly,
		   or the no-<dialog> fallback below is bypassed. */
		dialog.sheet {
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			background: var(--surface);
			color: var(--text);
			padding: 0;
			width: min(420px, calc(100vw - 2rem));
			box-shadow: var(--shadow-2);
			margin: auto;
			/* The sheet itself never scrolls; .sheet-body is the only scroller,
			   otherwise the UA default max-height produces a second scrollbar. */
			max-height: calc(100vh - 2rem);
			max-height: calc(100dvh - 2rem);
			overflow: hidden;
		}

		dialog.sheet[open] {
			display: flex;
			flex-direction: column;
		}

		/* Works whether the sections are wrapped in a <form method="dialog">
		   or sit directly inside the dialog. */
		dialog.sheet > form {
			display: flex;
			flex-direction: column;
			flex: 1 1 auto;
			min-height: 0;
		}

		/* Literal colours, never var(): ::backdrop did not inherit from its
		   dialog before Chrome 122, so a custom property resolves to nothing,
		   the declaration is invalid, and the backdrop falls back to
		   transparent. That is the classic "dialog does not dim" bug. */
		dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .38);
		}

		@media (prefers-color-scheme: dark) {
			:root:not(.light) dialog.sheet::backdrop {
				background: rgba(0, 0, 0, .6);
			}
		}

		:root.dark dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .6);
		}

		/* Dimming. Two paths only:
		   1. ::backdrop — every browser that has modal <dialog>.
		   2. .sheet-scrim — a real element the script inserts when showModal()
		      is missing (pre-2022 Safari/Firefox).

		   Everything in path 2 must stay old-CSS-safe: no inset, no :where,
		   no @supports selector(). Those all postdate the browsers it serves,
		   which is exactly how the previous version silently did nothing. */

		/* No <dialog> support means no UA rule hiding a closed dialog, so the
		   sheet would sit inline in the page. Spell it out. */
		dialog.sheet:not([open]) {
			display: none;
		}

		html.has-open-sheet {
			overflow: hidden;
		}

		.sheet-scrim {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			background: var(--scrim);
			z-index: 998;
		}

		dialog.sheet-fallback {
			display: flex;
			position: fixed;
			top: 50%;
			left: 50%;
			right: auto;
			bottom: auto;
			-webkit-transform: translate(-50%, -50%);
			transform: translate(-50%, -50%);
			z-index: 999;
		}

		.sheet-header {
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--sp-4);
			padding: var(--sp-4) var(--sp-5);
			border-bottom: 1px solid var(--border);
		}

		.sheet-header h2 {
			font-size: 1.0625rem;
		}

		.sheet-body {
			padding: var(--sp-5);
			display: flex;
			flex-direction: column;
			gap: var(--sp-4);
			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
			overscroll-behavior: contain;
		}

		.sheet-footer {
			flex: 0 0 auto;
			padding: var(--sp-4) var(--sp-5);
			border-top: 1px solid var(--border);
			display: flex;
			justify-content: flex-end;
			gap: var(--sp-2);
		}

		/* ---------- Utilities ----------
		   Deliberately few. If you reach for a stack of these on one element,
		   the component is missing a class instead. */
		.hidden { display: none !important; }
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
		.mono { font-family: var(--font-mono); }
		.muted { color: var(--text-muted); }
		.nums { font-variant-numeric: tabular-nums; }
		.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
		.grow { flex: 1; }

		/* ---------- Responsive ----------
		   Column counts are preserved on desktop and collapse predictably:
		   >=4 cols -> 2 cols on tablet -> 1 col on phone. */
		@media (max-width: 900px) {
			.row {
				grid-template-columns: repeat(min(var(--cols, 2), 2), minmax(0, 1fr));
			}
		}

		@media (max-width: 600px) {
			body {
				padding: var(--sp-4) var(--sp-3);
				gap: var(--sp-4);
			}

			.card {
				padding: var(--sp-4);
			}

			.app-header {
				gap: var(--sp-3);
				align-items: center;
				flex-wrap: nowrap;
			}

			/* full-width action buttons stack rather than squeeze */
			.row-flex > .grow {
				flex-basis: 100%;
			}

			.app-title-group h1 {
				font-size: 1.25rem;
			}

			.row {
				grid-template-columns: 1fr;
			}

			/* let tabs bleed to the card edge, but only inside a card */
			.card > .tabs,
			.card > * > .tabs {
				margin-inline: calc(var(--sp-4) * -1);
				padding-inline: var(--sp-4);
			}
		}

		/* =====================================================================
		   APP-SPECIFIC STYLES — MABBIMS Hijri Calendar
		   1200px = 330px control rail + calendar. The 7-column grid is intrinsic to
		   a calendar and never collapses; cells shrink instead.
		   ===================================================================== */
		:root {
			--content-max: 1200px;
			--accent: #f57c00;
			--accent-bg: #fff8f0;
		}
		@media (prefers-color-scheme: dark) {
			:root:not(.light) { --accent-bg: #1f1600; }
		}
		:root.dark { --accent-bg: #1f1600; }

		/* Controls rail + calendar; single column below 900px */
		.app-main {
			display: grid;
			grid-template-columns: 330px minmax(0, 1fr);
			gap: var(--sp-5);
			align-items: start;
		}
		@media (max-width: 900px) {
			.app-main { grid-template-columns: 1fr; }
		}

		.app-main > section {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-5);
			min-width: 0;
		}
		.section-title {
			font-size: 1.125rem;
			font-weight: 600;
			border-bottom: 1px solid var(--border);
			padding-bottom: var(--sp-3);
			margin-bottom: var(--sp-4);
		}

		.group {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			padding: var(--sp-4);
			border-radius: var(--radius);
		}
		.group + .group { margin-top: var(--sp-3); }
		.group label:last-child { margin-bottom: 0; }
		.group label > select,
		.group label > input { margin-top: var(--sp-1); }

		.inputs { display: flex; flex-direction: column; gap: var(--sp-3); }
		.input-row { display: flex; gap: var(--sp-2); align-items: center; }
		.input-row > * { flex: 1; }
		#hDayInput { flex: 1; }
		#hMonthInput { flex: 2.2; }
		#hYearInput { flex: 1.6; }
		.input-row input { padding-inline: var(--sp-2); text-align: center; }

		/* Calendar */
		.cal-card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			overflow: hidden;
		}
		.cal-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-3) var(--sp-2); }
		.cal-title { flex: 1; text-align: center; min-width: 0; }
		.cal-title-text { font-size: 1rem; font-weight: 700; }
		.cal-subtitle { font-size: .7rem; color: var(--text-muted); margin-top: 1px; }

		.nav-btn {
			width: auto;
			min-width: 2.25rem;
			min-height: 2.25rem;
			padding: 0 var(--sp-2);
			background: var(--muted);
			border: 1px solid var(--border);
			color: var(--text);
			font-size: .8rem;
			white-space: nowrap;
			flex: none;
		}
		.nav-btn:hover { background: var(--border); }

		.today-btn {
			display: block;
			margin: 0 var(--sp-3) var(--sp-2);
			width: calc(100% - var(--sp-3) * 2);
			background: transparent;
			border: 1px solid var(--border);
			color: var(--text);
			min-height: 2.25rem;
			font-size: .875rem;
			font-weight: 600;
		}
		.today-btn:hover { background: var(--muted); border-color: var(--primary); }

		/* 7 columns is intrinsic to a calendar — never collapsed.
		   Gridlines are drawn with a 1px gap over a border-coloured background,
		   so every line (header row included) is a uniform 1px with no double
		   borders and no per-cell edge exceptions. */
		.cal-grid {
			display: grid;
			grid-template-columns: repeat(7, minmax(0, 1fr));
			gap: 1px;
			background: var(--border);
			border-top: 1px solid var(--border);
		}
		.day-hdr {
			padding: var(--sp-2) 2px;

			font-size: .7rem;
			font-weight: 600;
			color: var(--text-muted);
			background: var(--surface-variant);
		}
		.day-hdr.fri { color: var(--accent); }
		.cell {
			padding: 4px 2px;
			min-height: 52px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1px;
			background: var(--surface);
			cursor: pointer;
			position: relative;
			min-width: 0;
			transition: background .12s;
		}
		.cell:hover { background: var(--muted); }
		.cell.fri-cell { background: var(--accent-bg); }
		.cell.fri-cell:hover { background: var(--muted); }
		.cell.other { opacity: .25; }
		.cell.sel, .cell.sel.fri-cell { background: var(--highlight-bg); }
		.cell.today::after {
			content: '';
			position: absolute;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			border: 2px solid var(--primary);
			pointer-events: none;
		}
		.cell.today .pdate { color: var(--primary); font-weight: 800; }
		.pdate { font-size: .95rem; font-weight: 700; line-height: 1; }
		.sdate { font-size: .65rem; color: var(--text-muted); text-align: center; line-height: 1.3; margin-top: 2px; }
		.sdate.new-m { color: var(--success); font-weight: 700; }
		.jul-lbl { font-size: .5rem; opacity: .7; vertical-align: super; }

		.field-row { display: flex; gap: var(--sp-2); }
		.field-row > * { flex: 1; min-width: 0; }
		.btn-link {
			background: none;
			border: 0;
			color: var(--primary);
			font-size: .8rem;
			padding: 0;
			min-height: 0;
			width: auto;
		}
		.btn-link:hover { text-decoration: underline; background: none; }

		.btn-pri { background: var(--primary); color: var(--on-primary); }
		.btn-sec { background: transparent; border: 1px solid var(--border); color: var(--text); }
		.btn-sec:hover { background: var(--muted); }

		.offline-warn {
			/* color-mix is Chrome 111+/Safari 16.2+; keep a flat fallback first. */
			background: var(--danger-bg);
			background: color-mix(in srgb, var(--danger) 12%, var(--surface));
			border: 1px solid var(--danger);
			color: var(--danger);
			border-radius: var(--radius);
			padding: var(--sp-3);
			font-size: .8rem;
			text-align: center;
		}
		.spinner {
			display: inline-block;
			width: .9em;
			height: .9em;
			border: 2px solid currentColor;
			border-right-color: transparent;
			border-radius: 50%;
			animation: spin .7s linear infinite;
			vertical-align: middle;
		}
		@keyframes spin { to { transform: rotate(360deg); } }

		.sr {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}

		@media (max-width: 380px) {
			.pdate { font-size: .85rem; }
			.sdate { font-size: .6rem; }
			.cell { min-height: 46px; }
		}

		/* Rules unique to this app that have no equivalent in the core.
		   Anything here that turns out to be reusable belongs in core.css. */
#appSubtitle {
				font-size: .8rem;
				opacity: .6;
				margin-top: 4px;
			}

			.lbl {
				font-size: .7rem;
				font-weight: 600;
				opacity: .6;
				margin-bottom: 2px;
				display: block;
			}

			.cell.sel {
				background: var(--highlight-bg);
			}

			.cell.sel.fri-cell {
				background: var(--highlight-bg);
			}

			.dlg-section-head {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 4px;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			@media (max-width: 380px) {
				.pdate {
					font-size: .85rem;
				}

				.sdate {
					font-size: .6rem;
				}

				.cell {
					min-height: 46px;
				}

				.nav-btn {
					padding: 5px 7px;
					font-size: .75rem;
					width: auto;
				}
			}
	</style>
	</head>

	<script>
		/* =====================================================================
		   SHARED SETTINGS BEHAVIOUR — identical in every app. Do not edit here.
		   Edit /shared-settings.js, then run sync_core.py.

		   Owns theme, language and the settings dialog so all apps behave the
		   same. Runs before app code, so window.AppSettings is ready by the time
		   an app's constructor executes.

		   An app is expected to:
		     1. set AppSettings.strings = <its translation table>
		     2. call AppSettings.detectLang(...) once to choose a start language
		     3. delegate its own theme()/lang() to applyTheme()/applyLang()
		   Persistence stays with the app; this layer never touches storage.
		   ===================================================================== */
		(function () {
			const root = document.documentElement;
			const $ = id => document.getElementById(id);

			/* Last-resort settings copy, used key-by-key when the app has no
			   translation table (or is missing a key). Keeps apps without an i18n
			   layer looking identical to those with one. */
			const FALLBACK = {
				en: { prefTitle: 'Settings', prefBtn: 'Settings', langLabel: 'Language',
					themeLabel: 'Theme', themeAuto: 'Auto', themeLight: 'Light', themeDark: 'Dark' },
				id: { prefTitle: 'Pengaturan', prefBtn: 'Pengaturan', langLabel: 'Bahasa',
					themeLabel: 'Tema', themeAuto: 'Otomatis', themeLight: 'Terang', themeDark: 'Gelap' }
			};

			const AppSettings = {
				/* The app's table, shaped { en: ..., id: ... }. Assign it as soon as it
				   is defined — renderSettings reads it on the first applyLang. */
				strings: null,
				/* Applies a theme and returns the value actually used.
				   'auto' clears both classes and defers to prefers-color-scheme.
				   Idempotent; also syncs the #theme select and fires 'themechange' on
				   <html> for canvas apps that must repaint. */
				applyTheme(value) {
					const v = (value === 'light' || value === 'dark') ? value : 'auto';
					root.classList.remove('light', 'dark');
					if (v !== 'auto') root.classList.add(v);
					const sel = $('theme');
					if (sel && sel.value !== v) sel.value = v;
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: v } }));
					return v;
				},

				/* Switches language: updates <html lang>, the #language select and the
				   dialog copy. Returns the value applied. Call this from the app's own
				   lang() rather than touching <html> directly. */
				applyLang(value) {
					const sel = $('language');
					const v = value || (sel && sel.value) || 'en';
					root.lang = v;
					if (sel && sel.value !== v) sel.value = v;
					this.renderSettings(v);
					return v;
				},

				/* Repaints the dialog copy: title, both field labels, the three theme
				   option names, and the trigger's accessible name. Driven entirely by ids
				   (#prefTitle, #langLabel, #themeLabel), so markup needs the right ids and
				   nothing else. */
				renderSettings(lang) {
					const l = lang || root.lang || 'en';
					const app = (this.strings && this.strings[l]) || {};
					const base = FALLBACK[l] || FALLBACK.en;
					const s = {};
					for (const k of Object.keys(FALLBACK.en)) s[k] = app[k] || base[k] || FALLBACK.en[k];

					['prefTitle', 'langLabel', 'themeLabel'].forEach(id => {
						const e = $(id);
						if (e) e.textContent = s[id];
					});

					const sel = $('theme');
					if (sel) [...sel.options].forEach(o => {
						const k = 'theme' + o.value.charAt(0).toUpperCase() + o.value.slice(1);
						if (s[k]) o.textContent = s[k];
					});

					['settingsBtn', 'prefBtn', 'openSettings'].forEach(id => {
						const b = $(id);
						if (b) { b.setAttribute('aria-label', s.prefBtn); b.title = s.prefBtn; }
					});
					return s;
				},

				/* Best browser language the app actually ships, e.g.
				   detectLang(Object.keys(text)). Walks navigator.languages in order and
				   matches region subtags ('id-ID' -> 'id'); falls back to list[0]. */
				detectLang(available) {
					const list = (available && available.length) ? available : ['en'];
					const tags = (navigator.languages && navigator.languages.length)
						? navigator.languages : [navigator.language || 'en'];
					for (const tag of tags) {
						const t = String(tag).toLowerCase();
						const hit = list.find(l => t === String(l).toLowerCase()
							|| t.startsWith(String(l).toLowerCase() + '-'));
						if (hit) return hit;
					}
					return list[0];
				}
			};

			/* Modal <dialog> landed in Safari 15.4 / Firefox 98. Older engines get a
			   non-modal open plus our own scrim, stacking and scroll lock, so the
			   dialog still dims the page instead of appearing inline. */
			const CAN_MODAL = typeof HTMLDialogElement !== 'undefined'
				&& typeof HTMLDialogElement.prototype.showModal === 'function';

			/* The scrim is a real node, not a root pseudo-element, so it needs no
			   modern CSS and can take the click-to-close itself. */
			function addScrim(dialog) {
				var scrim = document.querySelector('.sheet-scrim');
				if (!scrim) {
					scrim = document.createElement('div');
					scrim.className = 'sheet-scrim';
					document.body.appendChild(scrim);
				}
				scrim.onclick = function () { AppSettings.closeSheet(dialog); };
			}

			function removeScrim() {
				var scrim = document.querySelector('.sheet-scrim');
				if (scrim && scrim.parentNode) scrim.parentNode.removeChild(scrim);
			}

			/* Don't assume ::backdrop painted — engines differ on whether it can be
			   styled and whether it inherits. Measure it, and supply our own scrim
			   when it came out transparent, whatever the reason. */
			function backdropPaints(dialog) {
				var bg;
				try { bg = window.getComputedStyle(dialog, '::backdrop').backgroundColor; }
				catch (e) { return false; }
				if (!bg || bg === 'transparent' || bg === 'none') return false;
				var parts = bg.replace(/\s+/g, '').match(/^rgba?\(([^)]+)\)$/);
				if (!parts) return true;                       // named or hex: it paints
				var channels = parts[1].split(',');
				return channels.length < 4 || parseFloat(channels[3]) > 0;
			}

			AppSettings.openSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					try {
						if (!dialog.open) dialog.showModal();
						if (!backdropPaints(dialog)) addScrim(dialog);
						return;
					} catch (e) { /* wedged dialog: fall through and open it manually */ }
				}
				dialog.setAttribute('open', '');
				dialog.classList.add('sheet-fallback');
				root.classList.add('has-open-sheet');
				addScrim(dialog);
			};

			AppSettings.closeSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					if (dialog.open) dialog.close();
					return;
				}
				dialog.removeAttribute('open');
				dialog.classList.remove('sheet-fallback');
				root.classList.remove('has-open-sheet');
				removeScrim();
			};

			/* Wires a trigger + dialog pair once: open on click, close on backdrop
			   click, plus — on the fallback path only — Escape and form submit, which
			   native <dialog> already handles. Use this for every dialog; calling
			   showModal() directly skips the fallback. */
			AppSettings.wireSheet = function (btn, dialog) {
				if (!btn || !dialog || dialog.dataset.sheetWired) return;
				dialog.dataset.sheetWired = '1';
				btn.addEventListener('click', () => AppSettings.openSheet(dialog));
				dialog.addEventListener('click', e => {
					if (e.target === dialog) AppSettings.closeSheet(dialog);
				});
				dialog.addEventListener('close', () => {
					dialog.classList.remove('sheet-fallback');
					root.classList.remove('has-open-sheet');
					removeScrim();
				});
				if (!CAN_MODAL) {
					dialog.addEventListener('submit', e => { e.preventDefault(); AppSettings.closeSheet(dialog); });
					document.addEventListener('keydown', e => {
						if (e.key === 'Escape' && dialog.hasAttribute('open')) AppSettings.closeSheet(dialog);
					});
				}
			};

			window.AppSettings = AppSettings;

			/* CSS reacts to an OS scheme change on its own; this only re-fires
			   'themechange' so canvas apps (which bake colours into pixels) know to
			   redraw. Silent unless the user is on 'auto'. */
			window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
				const sel = $('theme');
				if (!sel || sel.value === 'auto') {
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: 'auto' } }));
				}
			});

			document.addEventListener('DOMContentLoaded', () => {
				/* Baseline wiring so a bare #theme / #language select works with no app
				   code at all. Apps with their own handlers keep them — both run, and
				   apply* are idempotent. */
				const themeSel = $('theme');
				if (themeSel) {
					themeSel.addEventListener('change', e => AppSettings.applyTheme(e.target.value));
					AppSettings.applyTheme(themeSel.value);
				}
				const langSel = $('language');
				if (langSel) {
					langSel.addEventListener('change', e => AppSettings.applyLang(e.target.value));
					AppSettings.applyLang(langSel.value);
				} else {
					AppSettings.renderSettings();
				}

				/* The conventional pair. Apps using other ids (HijriCalc,
				   OpenDensityTool) call wireSheet themselves. */
				AppSettings.wireSheet($('settingsBtn'), $('settingsDialog'));
			});
		})();
	</script>

			class HijriCalc {
				constructor() {
					this.offline = (typeof Astronomy === 'undefined');
					this.cache = null;
					this.loadState();
					state.viewDate = new Date();
					this.bindUI();
					this.applyTheme(state.theme);

					this.updateLang(state.lang);
					this.render();
					if (this.offline)

				loadState() {
					try {
						const s = JSON.parse(localStorage.getItem('hcState') || '{}');
						['lat', 'lon', 'lang', 'theme', 'weekStart', 'hijriAdj', 'primaryCalendar', 'calcMode', 'mabbimsSearchMode', 'gMode'].forEach(k=>{
							if (s[k] !== undefined)
								state[k] = s[k];
						}
						);
					} catch (e) {}
				}
				saveState() {
					const {lat, lon, lang, theme, weekStart, hijriAdj, primaryCalendar, calcMode, mabbimsSearchMode, gMode} = state;
					localStorage.setItem('hcState', JSON.stringify({
						lat,
						lon,
						lang,
						theme,
						weekStart,
						hijriAdj,
						primaryCalendar,
						calcMode,
						mabbimsSearchMode,
						gMode
					}));
				}

					try {

						this.cache = {};
					}

					}

					const tr = T[state.lang];
					return `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? tr.dirN : tr.dirS}, ${Math.abs(lon).toFixed(4)}° ${lon >= 0 ? tr.dirE : tr.dirW}`;
				}
				setInput(inp, d) {
					inp.value = `${String(d.getFullYear()).padStart(4, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
				}
				getInput(inp) {
					if (!inp.value)
						return null;
					const [y,m,d] = inp.value.split('-').map(Number);
					return new Date(y,m - 1,d);
				}

				bindUI() {
					AppSettings.wireSheet($('prefBtn'), $('prefDialog'));
					$('closePref').onclick = ()=>AppSettings.closeSheet($('prefDialog'));

						this.readFormFields();
						this.saveState();

						this.updateLang(state.lang);
						this.render();
						AppSettings.closeSheet($('prefDialog'));

					$('resetPrefBtn').onclick = ()=>{
						this.resetState();
						AppSettings.closeSheet($('prefDialog'));
					}
					;
					$('myLocBtn').onclick = ()=>this.getLocation();
					$('todayBtn').onclick = ()=>{

						this.setInput($('gDateInput'), state.viewDate);
						this.syncHijriInputs(state.viewDate);
						this.render();
					}
					;
					$('prevMonthBtn').onclick = ()=>this.navMonth(-1);
					$('nextMonthBtn').onclick = ()=>this.navMonth(1);

					window.addEventListener('keydown', e => {
						if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
						if (e.key === 'PageUp' || (e.key === 'ArrowLeft' && e.ctrlKey)) { e.preventDefault(); this.navMonth(-1); }
						if (e.key === 'PageDown' || (e.key === 'ArrowRight' && e.ctrlKey)) { e.preventDefault(); this.navMonth(1); }
					});

					$('calcMode').onchange = () => {
						$('mabbimsSettings').classList.toggle('hidden', $('calcMode').value !== 'astronomic');
					};
					$('mabbimsSearchMode').onchange = () => {
						$('customLocGroup').classList.toggle('hidden', $('mabbimsSearchMode').value !== 'point');
					};

					const goG = ()=>{
						const d = this.getInput($('gDateInput'));
						if (d) {
							state.viewDate = d;
							this.syncHijriInputs(d);
							this.render();
						}
					}
					;
					$('gDateInput').addEventListener('change', goG);
					$('gDateInput').addEventListener('keydown', e=>e.key === 'Enter' && goG());

					const goH = ()=>{
						const d = parseInt($('hDayInput').value)
						  , m = parseInt($('hMonthInput').value)
						  , y = parseInt($('hYearInput').value);
						if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
							const g = this.hijriToGregorian(y, m, d);
							state.viewDate = g;
							this.setInput($('gDateInput'), g);
							this.syncHijriInputs(g);
							this.render();
						}
					}
					;
					[$('hDayInput'), $('hMonthInput'), $('hYearInput')].forEach(el=>{
						el.addEventListener('change', goH);
						el.addEventListener('keydown', e=>e.key === 'Enter' && goH());
					}
					);
					$('hMonthInput').addEventListener('change', ()=>this.updateHDayLimit());
					$('hYearInput').addEventListener('input', ()=>this.updateHDayLimit());

					$('calendar').addEventListener('keydown', e=>{
						const cell = e.target.closest('.cell');
						if (!cell)
							return;
						if (e.key === 'Enter' || e.key === ' ') {
							e.preventDefault();
							cell.click();
							return;
						}
						const nav = {
							ArrowRight: 1,
							ArrowLeft: -1,
							ArrowUp: -7,
							ArrowDown: 7,
							Home: null,
							End: null,
							PageUp: null,
							PageDown: null
						};
						if (!(e.key in nav))
							return;
						e.preventDefault();
						const cells = [...$('calendar').querySelectorAll('.cell')];
						const i = cells.indexOf(cell);
						let ni = i;
						if (e.key === 'Home')
							ni = 0;
						else if (e.key === 'End')
							ni = cells.length - 1;
						else if (e.key === 'PageUp' || e.key === 'PageDown') {
							this.navMonth(e.key === 'PageDown' ? 1 : -1);
							return;
						} else
							ni += nav[e.key];

							cells[ni].focus();

					const tr = T[lang];

					document.title = tr.appTitle;

					if (this.offline)

					else if (state.calcMode === 'linear')

					else if (state.calcMode === 'tabular')
						sfx = tr.tabularSuffix;

					const locText = state.mabbimsSearchMode === 'archipelago' && state.calcMode === 'astronomic' ? tr.mabbimsArchipelago : this.fmtCoords(state.lat, state.lon);
					$('appSubtitle').textContent = locText + sfx;

					$('calTitle').textContent = tr.calTitle;

					$('hLbl').textContent = tr.hDateLabel;

					$('prefBtn').title = tr.prefBtn;

					$('prevMonthBtn').textContent = tr.prevBtn;
					$('nextMonthBtn').textContent = tr.nextBtn;
					$('formulaTitle').textContent = tr.formulaTitle;
					$('footerNote').textContent = tr.footer;
					$('calcModeLabel').textContent = tr.calcModeLabel;
					$('mabbimsSearchLabel').textContent = tr.mabbimsSearchLabel;
					$('gModeLabel').textContent = tr.gModeLabel;
					[...$('hMonthInput').options].forEach((o,i)=>o.textContent = tr.months[i]);

					const tOpt = (sel, pfx) => [...$(sel).options].forEach(o => {
						const k = pfx + o.value.charAt(0).toUpperCase() + o.value.slice(1);
						if (tr[k]) o.textContent = tr[k];
					});
					tOpt('theme', 'theme');
					tOpt('primaryCalendar', 'cal');
					tOpt('gModeSelect', 'gMode');
					tOpt('calcMode', 'calcMode');
					tOpt('mabbimsSearchMode', 'mabbims');

					[...$('weekStart').options].forEach(o => {
						const map = { '0': 'weekSun', '1': 'weekMon', '6': 'weekSat' };
						if (tr[map[o.value]]) o.textContent = tr[map[o.value]];
					});

					this.updateFormula(tr);
					this.render();
				}
				updateFormula(tr) {
					const mode = state.calcMode;
					if (mode === 'astronomic') {
						const area = state.mabbimsSearchMode === 'archipelago' ? 'Malay Archipelago (5° grid)' : 'Local Point';
						$('formulaDisplay').textContent = `${tr.criteria}:\n${tr.altitude} (Topo) ≥ 3°\n${tr.elongation} (Geo) ≥ 6.4°\nArea: ${area}`;
						$('formulaNote').innerHTML = '';
						$('formulaDesc').textContent = tr.formulaDescMabbims;
					} else if (mode === 'linear') {
						$('formulaDisplay').textContent = `JD = 1948440 + floor(29.53057017233·N + 0.0068) + Day − 1\nN = (Year−1)·12 + Month−1`;
						$('formulaNote').innerHTML = `<i>${tr.epoch}: 1 Muharram 1 AH = JD 1948440.</i>`;
						$('formulaDesc').textContent = tr.formulaDescLinear;
					} else {
						$('formulaDisplay').textContent = `Leap Year: ((11·Y + 29) mod 30) < 11\nJD = 1948440 + Cycle·10631 + yc·354 + Leaps(yc) + ⌈(M−1)·29.5⌉ + Day − 1\nLeaps(yc) = ⌊(11·yc + 29) / 30⌋`;
						$('formulaNote').innerHTML = `<i>${tr.epoch}: 1 Muharram 1 AH = JD 1948440. Y = cycle year 1–30. yc = years since 1 AH (0–29). M = month 1–12. ${tr.leapYears}: 1, 3, 6, 9, 11, 14, 17, 20, 22, 25, 28 ${tr.ofCycle}.</i>`;
						$('formulaDesc').textContent = tr.formulaDescTabular;
					}
				}

				syncHijriInputs(date) {
					const h = this.gregorianToHijri(date);
					$('hDayInput').value = h.day;
					$('hMonthInput').value = String(h.month);
					$('hYearInput').value = h.year;
					this.updateHDayLimit();
					this.updateHMonthTooltip();
				}
				updateHMonthTooltip() {
					const m = parseInt($('hMonthInput').value);
					if (!isNaN(m))
						$('hMonthInput').title = T[state.lang].months[m - 1];
				}
				updateHDayLimit() {
					const m = parseInt($('hMonthInput').value)
					  , y = parseInt($('hYearInput').value);
					if (!isNaN(m) && !isNaN(y)) {
						this.updateHMonthTooltip();
						const s1 = this.getMonthStart(y, m);
						const {year: ny, month: nm} = this.addMonths(y, m, 1);
						const s2 = this.getMonthStart(ny, nm);
						const days = Math.round((s2.gDate - s1.gDate) / 86400000);
						$('hDayInput').max = days;
						$('hDayInput').placeholder = `1-${days}`;
						if (parseInt($('hDayInput').value) > days)
							$('hDayInput').value = days;
					}
				}

				getLocation() {
					const tr = T[state.lang]
					  , btn = $('myLocBtn');
					if (!navigator.geolocation)
						return alert(tr.geoNotSupported);
					btn.disabled = true;
					btn.innerHTML = `<span class="spinner"></span> ${tr.locating}`;
					navigator.geolocation.getCurrentPosition(p=>{
						$('latInput').value = p.coords.latitude.toFixed(4);
						$('lonInput').value = p.coords.longitude.toFixed(4);
						btn.disabled = false;
						btn.textContent = tr.myLoc;
					}
					, err=>{
						alert(tr.errorLocation + err.message);
						btn.disabled = false;
						btn.textContent = tr.myLoc;
					}
					);
				}

				addMonths(y, m, d) {
					const x = m - 1 + d;
					return {
						year: y + Math.floor(x / 12),
						month: ((x % 12) + 12) % 12 + 1
					};
				}
				tzOff() {
					return Math.round(state.lon / 15);
				}

				jdToDate(jd) {
					const Z = Math.floor(jd + .5)
					  , F = jd + .5 - Z;
					let A = Z;
					if (state.gMode === 'proleptic' || Z >= 2299161) {
						const a = Math.floor((Z - 1867216.25) / 36524.25);
						A = Z + 1 + a - Math.floor(a / 4);
					}
					const B = A + 1524
					  , C = Math.floor((B - 122.1) / 365.25)
					  , D = Math.floor(365.25 * C)
					  , E = Math.floor((B - D) / 30.6001);
					const day = B - D - Math.floor(30.6001 * E) + F
					  , month = E < 14 ? E - 1 : E - 13
					  , year = month > 2 ? C - 4716 : C - 4715;
					const d = new Date(0);
					d.setFullYear(year, month - 1, Math.floor(day));
					return d;
				}
				dateToJD(date) {
					let Y = date.getFullYear()
					  , M = date.getMonth() + 1
					  , D = date.getDate()
					  , B = 0;
					if (M <= 2) {
						Y--;
						M += 12;
					}
					if (state.gMode === 'proleptic' || Y > 1582 || (Y === 1582 && (M > 10 || (M === 10 && D >= 15)))) {
						const A = Math.floor(Y / 100);
						B = 2 - A + Math.floor(A / 4);
					}
					return Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + D + B - 1524;
				}
				getDOW(jd) {
					return (Math.floor(jd + 1.5) % 7);
				}

				linMonthStartJD(idx) {
					const off = idx - 12;
					if (state.calcMode === 'tabular') {
						const cyc = Math.floor(off / 360);
						const rem = ((off % 360) + 360) % 360;
						const yc = Math.floor(rem / 12);
						const mc = rem % 12;
						const leaps = Math.floor((11 * yc + 29) / 30);
						return 1948440 + cyc * 10631 + yc * 354 + leaps + Math.floor(mc * 29.5 + 0.5);
					}
					return 1948440 + Math.floor(29.53057017233 * off + 0.0068);
				}
				linIdxFromJD(jd) {
					let i = Math.floor((jd - 1948440) / 29.530555) + 12;
					if (this.linMonthStartJD(i + 1) <= jd) i++;
					if (this.linMonthStartJD(i) > jd) i--;
					return i;
				}

				hijriToGregorianLinear(hy, hm, hd) {
					const idx = hy * 12 + hm - 1;
					return this.jdToDate(this.linMonthStartJD(idx) + hd - 1 + state.hijriAdj);
				}
				hijriToGregorian(hy, hm, hd) {
					if (this.offline || state.calcMode !== 'astronomic')
						return this.hijriToGregorianLinear(hy, hm, hd);
					const s = this.getMonthStart(hy, hm);
					const g = new Date(s.gDate);
					g.setDate(g.getDate() + (hd - 1));
					return g;
				}

				gregorianToHijriLinear(date) {
					let jd = this.dateToJD(date) - state.hijriAdj;
					const idx = this.linIdxFromJD(jd);
					const d = jd - this.linMonthStartJD(idx) + 1;
					let hm = (idx % 12);
					if (hm < 0)
						hm += 12;
					return {
						day: d,
						month: hm + 1,
						year: Math.floor(idx / 12)
					};
				}
				gregorianToHijri(date) {
					if (this.offline || state.calcMode !== 'astronomic')
						return this.gregorianToHijriLinear(date);
					const approx = this.gregorianToHijriLinear(date);
					const sc = this.getMonthStart(approx.year, approx.month);
					const dt = date.getTime()
					  , st = sc.gDate.getTime();
					if (dt < st) {
						const {year: py, month: pm} = this.addMonths(approx.year, approx.month, -1);
						const sp = this.getMonthStart(py, pm);
						return {
							day: Math.round((dt - sp.gDate.getTime()) / 86400000) + 1,
							month: pm,
							year: py
						};
					}
					const {year: ny, month: nm} = this.addMonths(approx.year, approx.month, 1);
					const sn = this.getMonthStart(ny, nm);
					if (dt >= sn.gDate.getTime())
						return {
							day: Math.round((dt - sn.gDate.getTime()) / 86400000) + 1,
							month: nm,
							year: ny
						};
					return {
						day: Math.round((dt - st) / 86400000) + 1,
						month: approx.month,
						year: approx.year
					};
				}

				checkVisibility(dateObj, nmUT, lat, lon) {
					const date = Astronomy.MakeTime(dateObj)
					  , obs = new Astronomy.Observer(lat, lon, 0);
					const ss = Astronomy.SearchRiseSet(Astronomy.Body.Sun, obs, -1, date.ut, 1);
					if (!ss)
						return false;
					const mVecJ = Astronomy.GeoVector(Astronomy.Body.Moon, ss.ut, true);
					const sVecJ = Astronomy.GeoVector(Astronomy.Body.Sun, ss.ut, true);
					const elongGeo = Astronomy.AngleBetween(mVecJ, sVecJ);
					if (elongGeo < 6.4) return false;

					const me = Astronomy.Equator(Astronomy.Body.Moon, ss.ut, obs, true, true);
					const mh = Astronomy.Horizon(ss.ut, obs, me.ra, me.dec, 'normal');
					return (mh.altitude >= 3);
				}

				getMonthStart(hy, hm) {
					if (this.offline || state.calcMode !== 'astronomic' || hy < 1300)
						return {
							gDate: this.hijriToGregorianLinear(hy, hm, 1)
						};
					if (!this.cache)
						this.loadCache();
					const k = `${hy}-${hm}-${state.lat}-${state.lon}-${state.mabbimsSearchMode}-${state.gMode}`;
					if (this.cache[k]) {
						if (typeof this.cache[k].gDate === 'string')
							this.cache[k].gDate = new Date(this.cache[k].gDate);
						return this.cache[k];
					}
					const approx = this.hijriToGregorianLinear(hy, hm, 1);
					const t = Astronomy.MakeTime(new Date(approx.getTime() - 5 * 86400000));
					const nm = Astronomy.SearchMoonPhase(0, t.ut, 10);

					let jdRes = null;
					if (state.mabbimsSearchMode === 'archipelago') {
						const lats = Array.from({ length: 4 }, (_, i) => 5 - i * 5);
						const lons = Array.from({ length: 10 }, (_, i) => 95 + i * 5);
						for (let dOff = 1; dOff <= 2; dOff++) {
							const base = new Date(nm.date.getTime() + dOff * 86400000);
							const y = base.getUTCFullYear(), m = base.getUTCMonth(), d = base.getUTCDate();
							let met = false;
							for (const lon of lons) {
								const tz = Math.round(lon / 15);
								for (const lat of lats) {
									if (this.checkVisibility(new Date(Date.UTC(y, m, d, 12 - tz, 0, 0)), nm.ut, lat, lon)) {
										met = true; break;
									}
								}
								if (met) break;
							}
							if (met) {
								jdRes = this.dateToJD(new Date(y, m, d)) + 1;
								break;
							}
						}
						if (!jdRes) jdRes = this.dateToJD(new Date(nm.date.getTime() + 3 * 86400000));
					} else {
						const tz = this.tzOff();
						for (let dOff = 1; dOff <= 2; dOff++) {
							const base = new Date(nm.date.getTime() + dOff * 86400000);
							const y = base.getUTCFullYear(), m = base.getUTCMonth(), d = base.getUTCDate();
							if (this.checkVisibility(new Date(Date.UTC(y, m, d, 12 - tz, 0, 0)), nm.ut, state.lat, state.lon)) {
								jdRes = this.dateToJD(new Date(y, m, d)) + 1;
								break;
							}
						}
						if (!jdRes) jdRes = this.dateToJD(new Date(nm.date.getTime() + 3 * 86400000));
					}

					const res = { gDate: this.jdToDate(jdRes) };
					this.cache[k] = res;
					this.schedSaveCache();
					return res;
				}

				navMonth(delta) {
					if (state.primaryCalendar === 'hijri') {
						const h = this.gregorianToHijri(state.viewDate);
						const {year: ny, month: nm} = this.addMonths(h.year, h.month, delta);
						const s = this.getMonthStart(ny, nm);
						state.viewDate = new Date(s.gDate.getTime() + 15 * 86400000);
					} else {
						const d = state.viewDate.getDate();
						state.viewDate.setDate(1);
						state.viewDate.setMonth(state.viewDate.getMonth() + delta);
						const max = new Date(state.viewDate.getFullYear(),state.viewDate.getMonth() + 1,0).getDate();
						state.viewDate.setDate(Math.min(d, max));
					}
					this.render();
				}

				render() {
					const tr = T[state.lang]
					  , grid = $('calendar');
					const isG = state.primaryCalendar !== 'hijri';
					if (isG) {
						const y = state.viewDate.getFullYear()
						  , m = state.viewDate.getMonth();
						$('monthDisplay').textContent = state.viewDate.toLocaleDateString(state.lang === 'id' ? 'id-ID' : 'en-US', {
							month: 'long',
							year: 'numeric'
						});
						const hS = this.gregorianToHijri(new Date(y,m,1))
						  , hE = this.gregorianToHijri(new Date(y,m + 1,0));
						$('hijriRangeDisplay').textContent = `${tr.months[hS.month - 1]} ${hS.year} – ${tr.months[hE.month - 1]} ${hE.year}`;
						const fjd = this.dateToJD(new Date(y,m,1));
						let off = this.getDOW(fjd) - state.weekStart;
						if (off < 0)
							off += 7;
						this.buildGrid(fjd - off, true, {
							month: m,
							year: y
						});
					} else {
						const h = this.gregorianToHijri(state.viewDate);
						const cs = this.getMonthStart(h.year, h.month);
						const {year: ny, month: nm} = this.addMonths(h.year, h.month, 1);
						const ns = this.getMonthStart(ny, nm);
						$('monthDisplay').textContent = `${tr.months[h.month - 1]} ${h.year}`;
						const gS = cs.gDate
						  , gE = new Date(ns.gDate.getTime() - 86400000);
						$('hijriRangeDisplay').textContent = `${gS.toLocaleDateString(state.lang === 'id' ? 'id-ID' : 'en-US', {
							month: 'short',
							year: 'numeric'
						})} – ${gE.toLocaleDateString(state.lang === 'id' ? 'id-ID' : 'en-US', {
							month: 'short',
							year: 'numeric'
						})}`;
						const sjd = this.dateToJD(cs.gDate);
						let off = this.getDOW(sjd) - state.weekStart;
						if (off < 0)
							off += 7;
						this.buildGrid(sjd - off, false, {
							hMonth: h.month,
							hYear: h.year,
							startJD: sjd,
							endJD: this.dateToJD(ns.gDate)
						});
					}
				}

				buildGrid(startJD, isG, ctx) {
					const tr = T[state.lang]
					  , grid = $('calendar')
					  , frag = document.createDocumentFragment();
					grid.innerHTML = '';
					for (let i = 0; i < 7; i++) {
						const di = (state.weekStart + i) % 7;
						const h = document.createElement('div');
						h.className = 'day-hdr' + (di === 5 ? ' fri' : '');
						h.setAttribute('role', 'columnheader');
						h.textContent = tr.days[di];
						frag.appendChild(h);
					}
					let hStarts = [];
					if (isG) {
						const sh = this.gregorianToHijri(this.jdToDate(startJD));
						for (let i = -1; i <= 3; i++) {
							const {year, month} = this.addMonths(sh.year, sh.month, i);
							const s = this.getMonthStart(year, month);
							hStarts.push({
								year,
								month,
								jd: this.dateToJD(s.gDate)
							});
						}
						hStarts.sort((a,b)=>a.jd - b.jd);
					}
					const todayJD = this.dateToJD(new Date());
					const selDate = this.getInput($('gDateInput'));
					const selJD = selDate ? this.dateToJD(selDate) : -1;

					for (let i = 0; i < 42; i++) {
						const jd = startJD + i;
						const date = this.jdToDate(jd);
						const hi = this.getHijriCell(jd, isG, ctx, hStarts);
						const isJul = (state.gMode === 'transition' && jd < 2299161);
						const isOther = isG ? (date.getMonth() !== ctx.month) : (jd < ctx.startJD || jd >= ctx.endJD);
						const isToday = (jd === todayJD)
						  , isSel = (jd === selJD)
						  , isFri = (this.getDOW(jd) === 5);

						const cell = document.createElement('div');
						cell.className = 'cell' + (isFri ? ' fri-cell' : '') + (isOther ? ' other' : '') + (isToday ? ' today' : '') + (isSel ? ' sel' : '');
						cell.setAttribute('role', 'gridcell');
						cell.tabIndex = -1;
						if (isToday)
							cell.setAttribute('aria-current', 'date');
						if (isSel)
							cell.setAttribute('aria-selected', 'true');
						cell.dataset.date = `${String(date.getFullYear()).padStart(4, '0')}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

						const isGmode = state.primaryCalendar !== 'hijri';
						const pv = isGmode ? date.getDate() : hi.day
						  , sv = isGmode ? hi.day : date.getDate();
						const isNewH = (hi.day === 1)
						  , isNewG = (date.getDate() === 1);
						const isNewSec = isGmode ? isNewH : isNewG;
						const showSecMon = (i === 0) || isNewSec;
						const julTag = `<sup class="jul-lbl">${tr.julian}</sup>`;
						const secMon = showSecMon ? ` ${isGmode ? hi.mn : date.toLocaleDateString(state.lang === 'id' ? 'id-ID' : 'en-US', {
							month: 'short'
						})}` : '';

						cell.innerHTML = `<div class="pdate">${pv}${isGmode && isJul ? julTag : ''}</div><div class="sdate${isNewSec ? ' new-m' : ''}">${sv}${!isGmode && isJul ? julTag : ''}${secMon}</div>`;
						cell.onclick = ()=>{
							state.viewDate = date;
							this.setInput($('gDateInput'), date);
							this.syncHijriInputs(date);
							this.render();
							$('calendar').querySelector('.cell.sel')?.focus();
						}
						;
						cell.setAttribute('aria-label', `${date.toLocaleDateString(state.lang === 'id' ? 'id-ID' : 'en-US', {
							weekday: 'long',
							year: 'numeric',
							month: 'long',
							day: 'numeric'
						})}, ${hi.day} ${hi.mf}`);
						frag.appendChild(cell);
					}
					grid.appendChild(frag);
					const fc = grid.querySelector('.cell.sel') || grid.querySelector('.cell.today') || grid.querySelector('.cell');
					if (fc)
						fc.tabIndex = 0;
				}

				getHijriCell(jd, isG, ctx, hStarts) {
					const tr = T[state.lang];
					if (isG) {
						for (let k = 0; k < hStarts.length - 1; k++) {
							if (jd >= hStarts[k].jd && jd < hStarts[k + 1].jd) {
								const mi = hStarts[k].month - 1;
								return {
									day: Math.round(jd - hStarts[k].jd) + 1,
									mf: tr.months[mi],
									mn: tr.monthsShort[mi]
								};
							}
						}
						return {
							day: '',
							mf: '',
							mn: ''
						};
					}
					let hjd, hm;
					if (jd >= ctx.startJD && jd < ctx.endJD) {
						hjd = ctx.startJD;
						hm = ctx.hMonth;
					} else if (jd < ctx.startJD) {
						const {year: py, month: pm} = this.addMonths(ctx.hYear, ctx.hMonth, -1);
						hjd = this.dateToJD(this.getMonthStart(py, pm).gDate);
						hm = pm;
					} else {
						const {year: ny, month: nm} = this.addMonths(ctx.hYear, ctx.hMonth, 1);
						hjd = this.dateToJD(this.getMonthStart(ny, nm).gDate);
						hm = nm;
					}
					return {
						day: Math.round(jd - hjd) + 1,
						mf: tr.months[hm - 1],
						mn: tr.monthsShort[hm - 1]
					};
				}
			}
			new HijriCalc();
		</script>
	</body>
</html>
