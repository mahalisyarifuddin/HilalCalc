<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Hilal Visibility Map</title>
	<style>
		/* =====================================================================
		   SHARED DESIGN CORE — identical in every app. Do not edit in place.
		   Edit /core.css, then run sync_core.py to push it to all apps.

		   Order: 1) tokens  2) reset/base  3) app shell  4) components.
		   App-specific rules go in the APP-SPECIFIC block below this one, so
		   they win on equal specificity without needing !important.
		   ===================================================================== */

		/* ---------- 1. Tokens: light (default) ----------
		   Style against these, never raw hex: every token has a dark twin, so
		   anything built from them themes itself for free. */
		:root {
			/* brand */
			--primary: #005dac;
			--on-primary: #ffffff;
			--hover: #00539a;
			--primary-container: #d4e3ff;
			--on-primary-container: #001c3a;

			/* surfaces */
			--background: #f9f9ff;
			--surface: #ffffff;
			--surface-variant: #f2f3fc;
			--muted: #f2f3fc;

			/* text */
			--text: #181c21;
			--text-muted: #5a6069;
			--text-secondary: #5a6069;

			/* lines */
			--border: #c1c6d4;
			--border-strong: #8f95a3;

			/* status */
			--success: #0b6b1d;
			--on-success: #ffffff;
			--success-bg: #d7f5d8;
			--danger: #ba1a1a;
			--error: #ba1a1a;
			--on-danger: #ffffff;
			--danger-bg: #ffdad6;
			--warning: #8a5000;
			--on-warning: #ffffff;
			--warning-bg: #ffedd5;
			--warning-text: #9a3412;
			--accent: #f57c00;
			--accent-bg: #fff8f0;
			--highlight-bg: #d4e3ff;

			/* elevation */
			--shadow-1: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .08);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .12);
			--scrim: rgba(0, 0, 0, .38);

			/* shape */
			--radius-sm: 4px;
			--radius: 8px;
			--radius-lg: 12px;
			--radius-pill: 999px;

			/* spacing scale */
			--sp-1: .25rem;
			--sp-2: .5rem;
			--sp-3: .75rem;
			--sp-4: 1rem;
			--sp-5: 1.5rem;
			--sp-6: 2rem;

			/* type */
			--font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

			/* layout — each app overrides this with its tier:
		   720 single-column · 960 standard · 1200 wide · 1600 dense/two-rail */
			--content-max: 960px;

			/* controls */
			--control-h: 42px;
		}

		/* ---------- 1b. Tokens: dark ----------
		   Duplicated on purpose: the media query serves "auto", the .dark class
		   serves an explicit choice. Change a value here and in .dark together. */
		@media (prefers-color-scheme: dark) {
			:root:not(.light) {
				--primary: #a5c8ff;
				--on-primary: #00315f;
				--hover: #72adff;
				--primary-container: #00468a;
				--on-primary-container: #d4e3ff;

				--background: #101319;
				--surface: #0b0e14;
				--surface-variant: #181c21;
				--muted: #181c21;

				--text: #e0e2ea;
				--text-muted: #a9b0bd;
				--text-secondary: #a9b0bd;

				--border: #414752;
				--border-strong: #6b7280;

				--success: #82db7e;
				--on-success: #00390a;
				--success-bg: #0b2a10;
				--danger: #ffb4ab;
				--error: #ffb4ab;
				--on-danger: #93000a;
				--danger-bg: #3b0907;
				--warning: #ffb95c;
				--on-warning: #3d2600;
				--warning-bg: #2b1c00;
				--warning-text: #ffd8a8;
				--accent: #ffb95c;
				--accent-bg: #1f1600;
				--highlight-bg: #001c3a;

				--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
				--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
				--scrim: rgba(0, 0, 0, .6);
			}
		}

		:root.dark {
			--primary: #a5c8ff;
			--on-primary: #00315f;
			--hover: #72adff;
			--primary-container: #00468a;
			--on-primary-container: #d4e3ff;

			--background: #101319;
			--surface: #0b0e14;
			--surface-variant: #181c21;
			--muted: #181c21;

			--text: #e0e2ea;
			--text-muted: #a9b0bd;
			--text-secondary: #a9b0bd;

			--border: #414752;
			--border-strong: #6b7280;

			--success: #82db7e;
			--on-success: #00390a;
			--success-bg: #0b2a10;
			--danger: #ffb4ab;
			--error: #ffb4ab;
			--on-danger: #93000a;
			--danger-bg: #3b0907;
			--warning: #ffb95c;
			--on-warning: #3d2600;
			--warning-bg: #2b1c00;
			--warning-text: #ffd8a8;
			--accent: #ffb95c;
			--accent-bg: #1f1600;
			--highlight-bg: #001c3a;

			--shadow-1: 0 1px 2px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
			--shadow-2: 0 4px 12px rgba(0, 0, 0, .55);
			--scrim: rgba(0, 0, 0, .6);
		}

		/* ---------- 2. Reset & base ----------
		   Headings are wrapped in :where() so they carry zero specificity — an
		   app can restyle h2 with a bare `h2 { }` and win. */
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html {
			-webkit-text-size-adjust: 100%;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: var(--font-sans);
			font-size: 1rem;
			line-height: 1.5;
			min-height: 100vh;
			min-height: 100dvh;
			padding: var(--sp-5) var(--sp-4);
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			-webkit-font-smoothing: antialiased;
		}

		:where(h1, h2, h3, h4, h5, h6) {
			line-height: 1.25;
			font-weight: 600;
			text-wrap: balance;
		}

		:where(h1) { font-size: 1.5rem; }
		:where(h2) { font-size: 1.125rem; }
		:where(h3) { font-size: 1rem; }
		:where(h4, h5, h6) { font-size: .9375rem; }

		a {
			color: var(--primary);
			text-decoration-thickness: 1px;
			text-underline-offset: 2px;
		}

		:focus-visible {
			outline: 2px solid var(--primary);
			outline-offset: 2px;
			border-radius: var(--radius-sm);
		}

		::selection {
			background: var(--primary-container);
			color: var(--on-primary-container);
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: .01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .01ms !important;
				scroll-behavior: auto !important;
			}
		}

		/* ---------- 3. App shell ----------
		   Header and main share --content-max, so every app lines up on the same
		   optical column whatever its width tier.

		   No page footer exists here, on purpose. Decorative footers (app name,
		   source link, "runs in your browser") are omitted; anything genuinely
		   useful goes in a .disclosure at the end of .app-main. */
		.app-header,
		.app-main {
			width: 100%;
			max-width: var(--content-max);
			margin-inline: auto;
		}

		.app-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: var(--sp-4);
			flex-wrap: wrap;
		}

		.app-title-group {
			flex: 1 1 16rem;
			display: flex;
			flex-direction: column;
			gap: var(--sp-1);
			min-width: 0;
		}

		.app-title-group h1 {
			font-size: 1.5rem;
			letter-spacing: -.01em;
		}

		.app-subtitle {
			color: var(--text-muted);
			font-size: .9375rem;
			max-width: 68ch;
		}

		.app-controls {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			flex-shrink: 0;
		}

		.app-main {
			display: flex;
			flex-direction: column;
			gap: var(--sp-5);
			flex: 1;
		}

		/* ---------- 4. Components ---------- */

		/* The one surface primitive: every panel is a .card. Add .card-subtle
		   for a nested block that must read as *inside* another card. */
		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: var(--sp-5);
			min-width: 0;
		}

		.card > h2,
		.card-title {
			font-size: 1.125rem;
			margin-bottom: var(--sp-4);
		}

		.card-subtle {
			background: var(--surface-variant);
		}

		/* Buttons. The bare <button> element is the primary action, so most
		   markup needs no class. Add .secondary (outline), .danger, .ghost, or
		   .btn-icon (square, icon-only). Keep one primary per view. */
		button,
		.btn {
			font: inherit;
			font-weight: 500;
			line-height: 1.2;
			background: var(--primary);
			color: var(--on-primary);
			border: 1px solid transparent;
			border-radius: var(--radius);
			padding: 0 var(--sp-4);
			min-height: var(--control-h);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: var(--sp-2);
			cursor: pointer;
			transition: background-color .15s, border-color .15s, color .15s;
		}

		button:hover,
		.btn:hover {
			background: var(--hover);
		}

		button:disabled,
		.btn:disabled {
			opacity: .5;
			cursor: not-allowed;
		}

		button.secondary,
		.btn-secondary {
			background: transparent;
			color: var(--primary);
			border-color: var(--border);
		}

		button.secondary:hover,
		.btn-secondary:hover {
			background: var(--surface-variant);
		}

		button.danger,
		.btn-danger {
			background: var(--danger);
			color: var(--on-danger);
		}

		button.danger:hover,
		.btn-danger:hover {
			filter: brightness(.92);
			background: var(--danger);
		}

		button.ghost,
		.btn-ghost {
			background: transparent;
			color: var(--text);
			border-color: transparent;
		}

		button.ghost:hover,
		.btn-ghost:hover {
			background: var(--surface-variant);
		}

		/* Square icon-only button — the Settings trigger and every dialog close.
		   Apps that make buttons full width must exclude it; see the
		   :not(:where(.btn-icon)) pattern in generator / OpenDensityTool. */
		.btn-icon {
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			width: var(--control-h);
			min-height: var(--control-h);
			padding: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.btn-icon:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.btn-icon svg {
			width: 20px;
			height: 20px;
			display: block;
		}

		/* Form controls. Inputs, selects and textareas are full width by design:
		   width is controlled by the .field / .row wrapper, not the control. */
		label {
			display: block;
			font-size: .875rem;
			font-weight: 500;
			color: var(--text);
			margin-bottom: var(--sp-1);
		}

		input,
		select,
		textarea {
			font: inherit;
			color: var(--text);
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-2) var(--sp-3);
			min-height: var(--control-h);
			width: 100%;
			max-width: 100%;
		}

		select {
			cursor: pointer;
			appearance: none;
			padding-right: 2rem;
			background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
				linear-gradient(135deg, currentColor 50%, transparent 50%);
			background-position: right 1.05rem center, right .8rem center;
			background-size: .3rem .3rem, .3rem .3rem;
			background-repeat: no-repeat;
		}

		textarea {
			min-height: 7rem;
			resize: vertical;
			line-height: 1.5;
		}

		input:hover,
		select:hover,
		textarea:hover {
			border-color: var(--border-strong);
		}

		input:focus,
		select:focus,
		textarea:focus {
			border-color: var(--primary);
		}

		input[type="checkbox"],
		input[type="radio"] {
			width: 1.125rem;
			height: 1.125rem;
			min-height: 0;
			accent-color: var(--primary);
			cursor: pointer;
			flex-shrink: 0;
		}

		input[type="range"] {
			padding: 0;
			min-height: 0;
			border: 0;
			background: transparent;
			accent-color: var(--primary);
		}

		input[type="color"] {
			padding: var(--sp-1);
			cursor: pointer;
		}

		input[type="file"] {
			padding: var(--sp-2);
		}

		input:disabled,
		select:disabled,
		textarea:disabled {
			background: var(--surface-variant);
			color: var(--text-muted);
			cursor: not-allowed;
		}

		/* Form layout. .field stacks one label + control; .row places fields side
		   by side. Set the column count on the row itself — style="--cols:3" —
		   and the responsive rules at the bottom handle the collapse. */
		.field {
			display: flex;
			flex-direction: column;
			min-width: 0;
			flex: 1;
		}

		.row {
			display: grid;
			grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
			gap: var(--sp-4);
			align-items: start;
		}

		.row-flex {
			display: flex;
			flex-wrap: wrap;
			gap: var(--sp-3);
			align-items: center;
		}

		.check {
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			font-weight: 400;
			margin-bottom: 0;
			cursor: pointer;
		}

		.hint {
			color: var(--text-muted);
			font-size: .8125rem;
			margin-top: var(--sp-1);
		}

		/* Tabs. Mark the active one with .active AND aria-selected="true" so
		   assistive tech and the styling never disagree. */
		.tabs {
			display: flex;
			gap: var(--sp-1);
			border-bottom: 1px solid var(--border);
			overflow-x: auto;
			scrollbar-width: none;
		}

		.tabs::-webkit-scrollbar {
			display: none;
		}

		.tab {
			background: transparent;
			color: var(--text-muted);
			border: 0;
			border-bottom: 2px solid transparent;
			border-radius: var(--radius-sm) var(--radius-sm) 0 0;
			padding: 0 var(--sp-4);
			white-space: nowrap;
		}

		.tab:hover {
			background: var(--surface-variant);
			color: var(--text);
		}

		.tab.active {
			color: var(--primary);
			border-bottom-color: var(--primary);
			background: transparent;
		}

		/* Tables. Cells never wrap; wrap the table in .table-wrap so wide data
		   scrolls sideways instead of bursting the card. */
		.table-wrap {
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			font-variant-numeric: tabular-nums;
		}

		th,
		td {
			text-align: left;
			padding: var(--sp-2) var(--sp-3);
			border-bottom: 1px solid var(--border);
			white-space: nowrap;
		}

		th {
			font-size: .8125rem;
			font-weight: 600;
			color: var(--text-muted);
			background: var(--surface-variant);
			position: sticky;
			top: 0;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		/* Small status pills. Use the semantic variant, not a colour name, so
		   meaning survives a palette change. */
		.badge {
			display: inline-flex;
			align-items: center;
			gap: var(--sp-1);
			font-size: .75rem;
			font-weight: 600;
			padding: var(--sp-1) var(--sp-2);
			border-radius: var(--radius-pill);
			background: var(--surface-variant);
			color: var(--text-muted);
			white-space: nowrap;
		}

		.badge-success { background: var(--success-bg); color: var(--success); }
		.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
		.badge-warning { background: var(--warning-bg); color: var(--warning-text); }

		/* Block-level callouts for explanation or warning. For secondary detail
		   nobody needs up front, prefer .disclosure below. */
		.notice {
			border: 1px solid var(--border);
			border-left: 3px solid var(--primary);
			background: var(--surface-variant);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
			font-size: .875rem;
		}

		.notice-warning { border-left-color: var(--accent); background: var(--warning-bg); color: var(--warning-text); }
		.notice-danger  { border-left-color: var(--danger); background: var(--danger-bg);  color: var(--danger); }

		/* ---------- Disclosure ----------
		   Where methodology, references and shortcuts live. Collapsed by default
		   so it never competes with the tool. This replaces the page footer —
		   if there is nothing worth reading, omit the block entirely. */
		.disclosure {
			background: var(--surface-variant);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-3) var(--sp-4);
		}

		.disclosure > summary {
			cursor: pointer;
			font-size: .875rem;
			font-weight: 600;
			color: var(--text-muted);
			display: flex;
			align-items: center;
			gap: var(--sp-2);
			list-style: none;
			user-select: none;
		}

		.disclosure > summary::-webkit-details-marker { display: none; }

		.disclosure > summary::before {
			content: "";
			width: 0;
			height: 0;
			border-left: 5px solid currentColor;
			border-top: 4px solid transparent;
			border-bottom: 4px solid transparent;
			transition: transform .2s;
			flex-shrink: 0;
		}

		.disclosure[open] > summary::before { transform: rotate(90deg); }
		.disclosure > summary:hover { color: var(--primary); }
		.disclosure[open] > summary { margin-bottom: var(--sp-3); }

		.disclosure-body {
			font-size: .875rem;
			line-height: 1.7;
			color: var(--text-muted);
		}

		.disclosure-body > * + * { margin-top: var(--sp-3); }

		.disclosure-body ul,
		.disclosure-body ol { padding-left: 1.25rem; }

		.disclosure-body li + li { margin-top: var(--sp-1); }

		.disclosure-body pre,
		.disclosure-body code {
			font-family: var(--font-mono);
			font-size: .8125rem;
		}

		.disclosure-body pre {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			padding: var(--sp-3);
			white-space: pre-wrap;
			overflow-x: auto;
		}

		/* ---------- Settings dialog ----------
		   Every app has one, opened by the header's .btn-icon. Structure is
		   .sheet-header / .sheet-body / .sheet-footer; only the body scrolls.
		   Open and close it via AppSettings.wireSheet, never showModal directly,
		   or the no-<dialog> fallback below is bypassed. */
		dialog.sheet {
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			background: var(--surface);
			color: var(--text);
			padding: 0;
			width: min(420px, calc(100vw - 2rem));
			box-shadow: var(--shadow-2);
			margin: auto;
			/* The sheet itself never scrolls; .sheet-body is the only scroller,
			   otherwise the UA default max-height produces a second scrollbar. */
			max-height: calc(100vh - 2rem);
			max-height: calc(100dvh - 2rem);
			overflow: hidden;
		}

		dialog.sheet[open] {
			display: flex;
			flex-direction: column;
		}

		/* Works whether the sections are wrapped in a <form method="dialog">
		   or sit directly inside the dialog. */
		dialog.sheet > form {
			display: flex;
			flex-direction: column;
			flex: 1 1 auto;
			min-height: 0;
		}

		/* Literal colours, never var(): ::backdrop did not inherit from its
		   dialog before Chrome 122, so a custom property resolves to nothing,
		   the declaration is invalid, and the backdrop falls back to
		   transparent. That is the classic "dialog does not dim" bug. */
		dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .38);
		}

		@media (prefers-color-scheme: dark) {
			:root:not(.light) dialog.sheet::backdrop {
				background: rgba(0, 0, 0, .6);
			}
		}

		:root.dark dialog.sheet::backdrop {
			background: rgba(0, 0, 0, .6);
		}

		/* Dimming. Two paths only:
		   1. ::backdrop — every browser that has modal <dialog>.
		   2. .sheet-scrim — a real element the script inserts when showModal()
		      is missing (pre-2022 Safari/Firefox).

		   Everything in path 2 must stay old-CSS-safe: no inset, no :where,
		   no @supports selector(). Those all postdate the browsers it serves,
		   which is exactly how the previous version silently did nothing. */

		/* No <dialog> support means no UA rule hiding a closed dialog, so the
		   sheet would sit inline in the page. Spell it out. */
		dialog.sheet:not([open]) {
			display: none;
		}

		html.has-open-sheet {
			overflow: hidden;
		}

		.sheet-scrim {
			position: fixed;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			background: var(--scrim);
			z-index: 998;
		}

		dialog.sheet-fallback {
			display: flex;
			position: fixed;
			top: 50%;
			left: 50%;
			right: auto;
			bottom: auto;
			-webkit-transform: translate(-50%, -50%);
			transform: translate(-50%, -50%);
			z-index: 999;
		}

		.sheet-header {
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: var(--sp-4);
			padding: var(--sp-4) var(--sp-5);
			border-bottom: 1px solid var(--border);
		}

		.sheet-header h2 {
			font-size: 1.0625rem;
		}

		.sheet-body {
			padding: var(--sp-5);
			display: flex;
			flex-direction: column;
			gap: var(--sp-4);
			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
			overscroll-behavior: contain;
		}

		.sheet-footer {
			flex: 0 0 auto;
			padding: var(--sp-4) var(--sp-5);
			border-top: 1px solid var(--border);
			display: flex;
			justify-content: flex-end;
			gap: var(--sp-2);
		}

		/* ---------- Utilities ----------
		   Deliberately few. If you reach for a stack of these on one element,
		   the component is missing a class instead. */
		.hidden { display: none !important; }
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			overflow: hidden;
			clip: rect(0 0 0 0);
			white-space: nowrap;
			border: 0;
		}
		.mono { font-family: var(--font-mono); }
		.muted { color: var(--text-muted); }
		.nums { font-variant-numeric: tabular-nums; }
		.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
		.grow { flex: 1; }

		/* ---------- Responsive ----------
		   Column counts are preserved on desktop and collapse predictably:
		   >=4 cols -> 2 cols on tablet -> 1 col on phone. */
		@media (max-width: 900px) {
			.row {
				grid-template-columns: repeat(min(var(--cols, 2), 2), minmax(0, 1fr));
			}
		}

		@media (max-width: 600px) {
			body {
				padding: var(--sp-4) var(--sp-3);
				gap: var(--sp-4);
			}

			.card {
				padding: var(--sp-4);
			}

			.app-header {
				gap: var(--sp-3);
				align-items: center;
				flex-wrap: nowrap;
			}

			/* full-width action buttons stack rather than squeeze */
			.row-flex > .grow {
				flex-basis: 100%;
			}

			.app-title-group h1 {
				font-size: 1.25rem;
			}

			.row {
				grid-template-columns: 1fr;
			}

			/* let tabs bleed to the card edge, but only inside a card */
			.card > .tabs,
			.card > * > .tabs {
				margin-inline: calc(var(--sp-4) * -1);
				padding-inline: var(--sp-4);
			}
		}

		/* =====================================================================
		   APP-SPECIFIC STYLES — HilalMap
		   1200px so the world map has room. Result tiles use auto-fill rather than a
		   fixed count, since the number of readings varies.
		   ===================================================================== */
		:root {
			--content-max: 1200px;
		}

		.info { font-size: .875rem; color: var(--text-muted); }

		#map-container {
			width: 100%;
			height: clamp(320px, 55vh, 560px);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			overflow: hidden;
			position: relative;
			background: var(--surface-variant);
			cursor: grab;
			touch-action: none;
		}
		#map-container:active { cursor: grabbing; }

		.map-controls {
			position: absolute;
			top: var(--sp-2);
			right: var(--sp-2);
			display: flex;
			flex-direction: column;
			gap: var(--sp-1);
			z-index: 5;
		}
		.map-controls button {
			width: 32px;
			height: 32px;
			min-height: 32px;
			padding: 0;
			font-size: 16px;
			background: var(--surface);
			color: var(--text);
			border: 1px solid var(--border);
			box-shadow: var(--shadow-1);
		}
		.map-controls button:hover { background: var(--surface-variant); }
		.map-controls button svg { width: 16px; height: 16px; }

		/* Results tiles — auto-fill keeps as many columns as fit */
		#results {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
			gap: var(--sp-4);
		}
		.result-card {
			background: var(--surface-variant);
			padding: var(--sp-4);
			border-radius: var(--radius);
			border: 1px solid var(--border);
			min-width: 0;
		}
		.result-label { font-size: .8rem; color: var(--text-muted); margin-bottom: var(--sp-1); }
		.result-value { font-size: 1.2rem; font-weight: 700; }

		/* Rules unique to this app that have no equivalent in the core.
		   Anything here that turns out to be reusable belongs in core.css. */
.primary { 
			background: var(--primary); 
			color: var(--on-primary); 
			border: 0; 
		}
		.primary:hover:not(:disabled) { 
			background: var(--hover); 
		}
		#map-wrapper {
			position: absolute;
			top: 50%;
			left: 50%;
			transform-origin: center center;
			width: 100%;
			height: 100%;
		}
		#map-image {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
			user-select: none;
			position: absolute;
			top: 0;
			left: 0;
		}
		#map-overlay {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			image-rendering: auto;
		}
		/* Fase 2 — opacity + land toggle + cache UI */
		.opacity-row {
			display: flex;
			align-items: center;
			gap: var(--sp-3);
		}
		.cache-badge {
			display: inline-flex;
			align-items: center;
			gap: var(--sp-1);
			font-size: .75rem;
			font-weight: 600;
			padding: 2px 8px;
			border-radius: var(--radius-pill);
			border: 1px solid var(--border);
			background: var(--surface-variant);
			color: var(--text-muted);
		}
		.cache-badge.hit { background: var(--success-bg); color: var(--success); border-color: var(--success); }
		/* Garis kontur — tooltip & marker */
		#mapTooltip {
			position: absolute;
			pointer-events: none;
			background: var(--surface);
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: var(--sp-2) var(--sp-3);
			font-size: .8125rem;
			line-height: 1.4;
			box-shadow: var(--shadow-2);
			z-index: 6;
			max-width: 220px;
			display: none;
			white-space: nowrap;
		}
		#mapTooltip.show { display: block; }
		.map-marker {
			position: absolute;
			width: 18px; height: 18px;
			transform: translate(-50%,-50%);
			pointer-events: none;
			z-index: 4;
			filter: drop-shadow(0 1px 2px rgba(0,0,0,.4));
		}
		.map-marker svg { width:100%; height:100%; display:block; }
		.contour-label {
			position: absolute;
			background: var(--surface);
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: var(--radius-pill);
			padding: 2px 8px;
			font-size: .6875rem;
			font-weight: 600;
			pointer-events: none;
			z-index: 4;
			white-space: nowrap;
			box-shadow: var(--shadow-1);
			transform: translate(-50%,-50%);
		}
		.spinner {
			display: inline-block;
			width: 1em;
			height: 1em;
			border: 2px solid currentColor;
			border-right-color: transparent;
			border-radius: 50%;
			animation: spin 0.75s linear infinite;
			vertical-align: text-bottom;
			margin-right: 4px;
		}
		@keyframes spin { 
			100% { 
				transform: rotate(360deg); 
			} 
		}
	</style>
</head>

	<dialog id="settingsDialog" class="sheet" aria-labelledby="prefTitle">

	<script>
		/* =====================================================================
		   SHARED SETTINGS BEHAVIOUR — identical in every app. Do not edit here.
		   Edit /shared-settings.js, then run sync_core.py.

		   Owns theme, language and the settings dialog so all apps behave the
		   same. Runs before app code, so window.AppSettings is ready by the time
		   an app's constructor executes.

		   An app is expected to:
		     1. set AppSettings.strings = <its translation table>
		     2. call AppSettings.detectLang(...) once to choose a start language
		     3. delegate its own theme()/lang() to applyTheme()/applyLang()
		   Persistence stays with the app; this layer never touches storage.
		   ===================================================================== */
		(function () {
			const root = document.documentElement;
			const $ = id => document.getElementById(id);

			/* Last-resort settings copy, used key-by-key when the app has no
			   translation table (or is missing a key). Keeps apps without an i18n
			   layer looking identical to those with one. */
			const FALLBACK = {
				en: { prefTitle: 'Settings', prefBtn: 'Settings', langLabel: 'Language',
					themeLabel: 'Theme', themeAuto: 'Auto', themeLight: 'Light', themeDark: 'Dark' },
				id: { prefTitle: 'Pengaturan', prefBtn: 'Pengaturan', langLabel: 'Bahasa',
					themeLabel: 'Tema', themeAuto: 'Otomatis', themeLight: 'Terang', themeDark: 'Gelap' }
			};

			const AppSettings = {
				/* The app's table, shaped { en: ..., id: ... }. Assign it as soon as it
				   is defined — renderSettings reads it on the first applyLang. */
				strings: null,
				/* Applies a theme and returns the value actually used.
				   'auto' clears both classes and defers to prefers-color-scheme.
				   Idempotent; also syncs the #theme select and fires 'themechange' on
				   <html> for canvas apps that must repaint. */
				applyTheme(value) {
					const v = (value === 'light' || value === 'dark') ? value : 'auto';
					root.classList.remove('light', 'dark');
					if (v !== 'auto') root.classList.add(v);
					const sel = $('theme');
					if (sel && sel.value !== v) sel.value = v;
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: v } }));
					return v;
				},

				/* Switches language: updates <html lang>, the #language select and the
				   dialog copy. Returns the value applied. Call this from the app's own
				   lang() rather than touching <html> directly. */
				applyLang(value) {
					const sel = $('language');
					const v = value || (sel && sel.value) || 'en';
					root.lang = v;
					if (sel && sel.value !== v) sel.value = v;
					this.renderSettings(v);
					return v;
				},

				/* Repaints the dialog copy: title, both field labels, the three theme
				   option names, and the trigger's accessible name. Driven entirely by ids
				   (#prefTitle, #langLabel, #themeLabel), so markup needs the right ids and
				   nothing else. */
				renderSettings(lang) {
					const l = lang || root.lang || 'en';
					const app = (this.strings && this.strings[l]) || {};
					const base = FALLBACK[l] || FALLBACK.en;
					const s = {};
					for (const k of Object.keys(FALLBACK.en)) s[k] = app[k] || base[k] || FALLBACK.en[k];

					['prefTitle', 'langLabel', 'themeLabel'].forEach(id => {
						const e = $(id);
						if (e) e.textContent = s[id];
					});

					const sel = $('theme');
					if (sel) [...sel.options].forEach(o => {
						const k = 'theme' + o.value.charAt(0).toUpperCase() + o.value.slice(1);
						if (s[k]) o.textContent = s[k];
					});

					['settingsBtn', 'prefBtn', 'openSettings'].forEach(id => {
						const b = $(id);
						if (b) { b.setAttribute('aria-label', s.prefBtn); b.title = s.prefBtn; }
					});
					return s;
				},

				/* Best browser language the app actually ships, e.g.
				   detectLang(Object.keys(text)). Walks navigator.languages in order and
				   matches region subtags ('id-ID' -> 'id'); falls back to list[0]. */
				detectLang(available) {
					const list = (available && available.length) ? available : ['en'];
					const tags = (navigator.languages && navigator.languages.length)
						? navigator.languages : [navigator.language || 'en'];
					for (const tag of tags) {
						const t = String(tag).toLowerCase();
						const hit = list.find(l => t === String(l).toLowerCase()
							|| t.startsWith(String(l).toLowerCase() + '-'));
						if (hit) return hit;
					}
					return list[0];
				}
			};

			/* Modal <dialog> landed in Safari 15.4 / Firefox 98. Older engines get a
			   non-modal open plus our own scrim, stacking and scroll lock, so the
			   dialog still dims the page instead of appearing inline. */
			const CAN_MODAL = typeof HTMLDialogElement !== 'undefined'
				&& typeof HTMLDialogElement.prototype.showModal === 'function';

			/* The scrim is a real node, not a root pseudo-element, so it needs no
			   modern CSS and can take the click-to-close itself. */
			function addScrim(dialog) {
				var scrim = document.querySelector('.sheet-scrim');
				if (!scrim) {
					scrim = document.createElement('div');
					scrim.className = 'sheet-scrim';
					document.body.appendChild(scrim);
				}
				scrim.onclick = function () { AppSettings.closeSheet(dialog); };
			}

			function removeScrim() {
				var scrim = document.querySelector('.sheet-scrim');
				if (scrim && scrim.parentNode) scrim.parentNode.removeChild(scrim);
			}

			/* Don't assume ::backdrop painted — engines differ on whether it can be
			   styled and whether it inherits. Measure it, and supply our own scrim
			   when it came out transparent, whatever the reason. */
			function backdropPaints(dialog) {
				var bg;
				try { bg = window.getComputedStyle(dialog, '::backdrop').backgroundColor; }
				catch (e) { return false; }
				if (!bg || bg === 'transparent' || bg === 'none') return false;
				var parts = bg.replace(/\s+/g, '').match(/^rgba?\(([^)]+)\)$/);
				if (!parts) return true;                       // named or hex: it paints
				var channels = parts[1].split(',');
				return channels.length < 4 || parseFloat(channels[3]) > 0;
			}

			AppSettings.openSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					try {
						if (!dialog.open) dialog.showModal();
						if (!backdropPaints(dialog)) addScrim(dialog);
						return;
					} catch (e) { /* wedged dialog: fall through and open it manually */ }
				}
				dialog.setAttribute('open', '');
				dialog.classList.add('sheet-fallback');
				root.classList.add('has-open-sheet');
				addScrim(dialog);
			};

			AppSettings.closeSheet = function (dialog) {
				if (!dialog) return;
				if (CAN_MODAL) {
					if (dialog.open) dialog.close();
					return;
				}
				dialog.removeAttribute('open');
				dialog.classList.remove('sheet-fallback');
				root.classList.remove('has-open-sheet');
				removeScrim();
			};

			/* Wires a trigger + dialog pair once: open on click, close on backdrop
			   click, plus — on the fallback path only — Escape and form submit, which
			   native <dialog> already handles. Use this for every dialog; calling
			   showModal() directly skips the fallback. */
			AppSettings.wireSheet = function (btn, dialog) {
				if (!btn || !dialog || dialog.dataset.sheetWired) return;
				dialog.dataset.sheetWired = '1';
				btn.addEventListener('click', () => AppSettings.openSheet(dialog));
				dialog.addEventListener('click', e => {
					if (e.target === dialog) AppSettings.closeSheet(dialog);
				});
				dialog.addEventListener('close', () => {
					dialog.classList.remove('sheet-fallback');
					root.classList.remove('has-open-sheet');
					removeScrim();
				});
				if (!CAN_MODAL) {
					dialog.addEventListener('submit', e => { e.preventDefault(); AppSettings.closeSheet(dialog); });
					document.addEventListener('keydown', e => {
						if (e.key === 'Escape' && dialog.hasAttribute('open')) AppSettings.closeSheet(dialog);
					});
				}
			};

			window.AppSettings = AppSettings;

			/* CSS reacts to an OS scheme change on its own; this only re-fires
			   'themechange' so canvas apps (which bake colours into pixels) know to
			   redraw. Silent unless the user is on 'auto'. */
			window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
				const sel = $('theme');
				if (!sel || sel.value === 'auto') {
					root.dispatchEvent(new CustomEvent('themechange', { detail: { theme: 'auto' } }));
				}
			});

			document.addEventListener('DOMContentLoaded', () => {
				/* Baseline wiring so a bare #theme / #language select works with no app
				   code at all. Apps with their own handlers keep them — both run, and
				   apply* are idempotent. */
				const themeSel = $('theme');
				if (themeSel) {
					themeSel.addEventListener('change', e => AppSettings.applyTheme(e.target.value));
					AppSettings.applyTheme(themeSel.value);
				}
				const langSel = $('language');
				if (langSel) {
					langSel.addEventListener('change', e => AppSettings.applyLang(e.target.value));
					AppSettings.applyLang(langSel.value);
				} else {
					AppSettings.renderSettings();
				}

				/* The conventional pair. Apps using other ids (HijriCalc,
				   OpenDensityTool) call wireSheet themselves. */
				AppSettings.wireSheet($('settingsBtn'), $('settingsDialog'));
			});
		})();
	</script>

		const WORKER_CODE = `importScripts("https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js");

const calculateSunset = (lat, lon, baseDateUT) => {
	const obs = new Astronomy.Observer(lat, lon, 0);
	return Astronomy.SearchRiseSet(Astronomy.Body.Sun, obs, -1, baseDateUT - (lon / 15 / 24), 1);
};

self.onmessage = e => {
	try {
		const { bounds, widthDeg, heightDeg, criteria, dateTimestamp, minAlt, minElong } = e.data;
		const maxGridSize = 245;
		const cellSizeDeg = Math.max(widthDeg / maxGridSize, heightDeg / maxGridSize, 0.1);
		const width = Math.min(Math.ceil(widthDeg / cellSizeDeg), maxGridSize);
		const height = Math.min(Math.ceil(heightDeg / cellSizeDeg), maxGridSize);
		const buffer = new Uint8ClampedArray(width * height * 4);
		const date = Astronomy.MakeTime(new Date(dateTimestamp));

		let criteriaMinAlt, criteriaMinElong, isGIC;
		if (criteria === "mabbims") {
			criteriaMinAlt = 3; criteriaMinElong = 6.4; isGIC = false;
		} else if (criteria === "gic") {
			criteriaMinAlt = 5; criteriaMinElong = 8; isGIC = true;
		} else if (criteria === "global") {
			criteriaMinAlt = 0; criteriaMinElong = 0; isGIC = false;
		} else if (criteria === "alt0") {
			criteriaMinAlt = 0; criteriaMinElong = -100; isGIC = false;
		} else {
			criteriaMinAlt = minAlt; criteriaMinElong = minElong; isGIC = false;
		}

		const NZ_LAT = -41.28, NZ_LON = 174.77;
		let fajrNZ_ut = null;
		if (isGIC) {
			const nzObs = new Astronomy.Observer(NZ_LAT, NZ_LON, 0);
			const fajrNZ = Astronomy.SearchAltitude(Astronomy.Body.Sun, nzObs, 1, date, 2.0, -18.0);
			if (fajrNZ) fajrNZ_ut = fajrNZ.ut;
		}

		const latToPlateCarreeY = lat => lat;
		const plateCarreeYToLat = y => y;

		const minY = latToPlateCarreeY(bounds.minLat);
		const maxY = latToPlateCarreeY(bounds.maxLat);
		const yRange = maxY - minY;
		const STEP = 10;

		for (let row = 0; row < height; row++) {
			const lat = plateCarreeYToLat(maxY - (row / (height - 1 || 1)) * yRange);
			let prevCol = -1;
			let nextCol = -1;
			let prevSunset = null;
			let nextSunset = null;

			for (let col = 0; col < width; col++) {
				const lon = bounds.minLon + (col * cellSizeDeg);
				let sunset = null;

				if (col >= nextCol) {
					prevCol = col;
					prevSunset = (col === nextCol && nextSunset !== null) ? nextSunset : calculateSunset(lat, lon, date.ut);
					nextCol = Math.min(col + STEP, width - 1);
					nextSunset = (nextCol === prevCol) ? prevSunset : calculateSunset(lat, bounds.minLon + (nextCol * cellSizeDeg), date.ut);
				}

				if (prevSunset && nextSunset) {
					sunset = { ut: prevSunset.ut + (nextSunset.ut - prevSunset.ut) * ((col - prevCol) / (nextCol - prevCol || 1)) };
				} else {
					sunset = calculateSunset(lat, lon, date.ut);
				}

				let visible = false;
				if (sunset) {
					let isBeforeDeadline = true;
					if (isGIC) {
						isBeforeDeadline = fajrNZ_ut !== null && sunset.ut < fajrNZ_ut;
					}

					if (isBeforeDeadline) {
						const obs = new Astronomy.Observer(lat, lon, 0);
						let mEq, rot;
						if (isGIC) {
							const mVecJ = Astronomy.GeoVector(Astronomy.Body.Moon, sunset.ut, true);
							rot = Astronomy.Rotation_EQJ_EQD(sunset.ut);
							mEq = Astronomy.EquatorFromVector(Astronomy.RotateVector(rot, mVecJ));
						} else {
							mEq = Astronomy.Equator(Astronomy.Body.Moon, sunset.ut, obs, true, true);
						}
						const mHor = Astronomy.Horizon(sunset.ut, obs, mEq.ra, mEq.dec, "normal");

						if (mHor.altitude >= criteriaMinAlt) {
							let sEq;
							if (isGIC) {
								const sVecJ = Astronomy.GeoVector(Astronomy.Body.Sun, sunset.ut, true);
								sEq = Astronomy.EquatorFromVector(Astronomy.RotateVector(rot, sVecJ));
							} else {
								sEq = Astronomy.Equator(Astronomy.Body.Sun, sunset.ut, obs, true, true);
							}
							visible = Astronomy.AngleBetween(sEq.vec, mEq.vec) >= criteriaMinElong;
						}
					}
				}

				const idx = (row * width + col) * 4;
				if (visible) {
					buffer[idx] = 0; buffer[idx+1] = 150; buffer[idx+2] = 0; buffer[idx+3] = 100;
				} else {
					buffer[idx] = 0; buffer[idx+1] = 0; buffer[idx+2] = 0; buffer[idx+3] = 0;
				}
			}
			if (row % 10 === 0) {
				self.postMessage({progress: (row / height * 100).toFixed(0)});
			}
		}
		self.postMessage({width, height, buffer: buffer.buffer}, [buffer.buffer]);
	} catch(err) {
		self.postMessage({error: err.message});
	}
};`;

		class HilalMap {
			constructor() {
				this.cacheVersion = 7; // bump for Fase 2+ garis kontur
				this.language = AppSettings.detectLang(Object.keys(text));
				this.themeName = 'auto';
				this.worker = null;
				this.isRendering = false;
				// Fase 2: opacity + land mask + render cache
				this.renderCache = new Map(); // key -> {width,height,buffer:ArrayBuffer}
				this.opacity = 40;
				this.landOnly = false;
				// Garis kontur ala KHGT
				this.lineMode = true; // default garis, bukan shading
				this.lineWidth = 2;
				this.contourSegments = []; // for tooltip & marker
				this.markerPos = null;
				this.landGeojson = null;
				this.landCache = {};
				this.currentImageDataRaw = null; // unfiltered raw buffer for toggling
				this.loadState();
				this.setup();
			}

			loadState() {
				try {
					const s = JSON.parse(localStorage.getItem('hmState') || '{}');
					if (s.language) this.language = s.language;
					if (s.theme) this.themeName = s.theme;
					if (s.opacity != null) this.opacity = s.opacity;
					if (s.landOnly != null) this.landOnly = s.landOnly;
					if (s.lineMode != null) this.lineMode = s.lineMode;
					if (s.lineWidth != null) this.lineWidth = s.lineWidth;
				} catch (e) {}
			}

			saveState() {
				localStorage.setItem('hmState', JSON.stringify({
					language: this.language,
					theme: this.themeName,
					opacity: this.opacity,
					landOnly: this.landOnly,
					lineMode: this.lineMode,
					lineWidth: this.lineWidth
				}));
			}
			// warna garis per kriteria (mirip KHGT: tegas, kontras)
			getContourColor(criteria) {
				if (criteria==='mabbims') return '#0B6B1D'; // hijau MABBIMS
				if (criteria==='gic') return '#005DAC'; // biru KHGT
				if (criteria==='global') return '#8A5000'; // coklat
				if (criteria==='alt0') return '#6B7280';
				return '#005DAC';
			}

			// Fase 2: land mask loader (reuses ne_110m_land.geojson if present)
			async loadLandMask() {
				const landStatus = $('landStatus');
				if (landStatus) { landStatus.textContent = this.string('landLoading'); landStatus.classList.remove('hidden'); }
				try {
					const r = await fetch('ne_110m_land.geojson');
					if (r.ok) {
						this.landGeojson = await r.json();
						if (landStatus) { landStatus.textContent = this.string('landReady'); setTimeout(()=>landStatus.classList.add('hidden'), 2000); }
						return;
					}
				} catch(e){}
				try {
					const r2 = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson');
					if (r2.ok) this.landGeojson = await r2.json();
				} catch(e2){}
				if (landStatus) {
					if (this.landGeojson) { landStatus.textContent = this.string('landReady'); setTimeout(()=>landStatus.classList.add('hidden'), 2000); }
					else { landStatus.textContent = this.string('landFallback'); }
				}
			}
			isLand(lat, lon, bufferDeg=0) {
				const key = `${lat.toFixed(2)},${lon.toFixed(2)},${bufferDeg}`;
				if (this.landCache[key] !== undefined) return this.landCache[key];
				if (!this.landGeojson) {
					// fallback approximate: treat ocean-heavy Pacific as water for demo
					// world without geojson: assume true to not hide anything
					this.landCache[key] = true; return true;
				}
				const pt = [lon, lat];
				const inRing = (pt, ring) => {
					let inside=false;
					for (let i=0,j=ring.length-1;i<ring.length;j=i++) {
						const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
						if (((yi>pt[1])!==(yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) inside=!inside;
					}
					return inside;
				};
				const inPoly = (pt, rings) => {
					if (!inRing(pt, rings[0])) return false;
					for (let i=1;i<rings.length;i++) if (inRing(pt, rings[i])) return false;
					return true;
				};
				const check = (la,lo) => {
					const p=[lo,la];
					for (const f of this.landGeojson.features) {
						if (f.geometry.type==='Polygon') { if (inPoly(p,f.geometry.coordinates)) return true; }
						else if (f.geometry.type==='MultiPolygon') { for (const poly of f.geometry.coordinates) if (inPoly(p,poly)) return true; }
					}
					return false;
				};
				let res;
				if (bufferDeg===0) res = check(lat,lon);
				else res = [[0,0],[-bufferDeg,-bufferDeg],[-bufferDeg,bufferDeg],[bufferDeg,-bufferDeg],[bufferDeg,bufferDeg]].some(([dla,dlo])=>check(lat+dla, lon+dlo));
				this.landCache[key]=res; return res;
			}
			getCacheKey(region, criteria, dateStr, minAlt, minElong) {
				return `${region}|${criteria}|${dateStr}|${minAlt}|${minElong}`;
			}
			updateCacheUI(hit) {
				const cs = $('cacheStatus'), txt=$('cacheStatusText'), cnt=$('cacheCount');
				if (!cs) return;
				cs.classList.remove('hidden');
				if (hit) {
					txt.textContent = this.string('cacheHit') + ' — ' + this.lastBounds.minLat + '°..' + this.lastBounds.maxLat + '°';
					cnt.classList.add('hit');
				} else {
					txt.textContent = this.string('cacheMiss');
					cnt.classList.remove('hit');
				}
				cnt.textContent = `${this.renderCache.size} ${this.string('cacheCount')}`;
				cs.style.display='flex';
			}
			applyOpacity() {
				const ov = $('map-overlay');
				if (ov) ov.style.opacity = (this.opacity/100).toString();
				const v = $('opacityValue'); if (v) v.textContent = this.opacity + '%';
			}

			setup() {
				$('language').value = this.language;
				$('theme').value = this.themeName;
				this.lang(this.language);
				this.theme(this.themeName);

				$('language').onchange = event=>this.lang(event.target.value);
				$('theme').onchange = event=>this.theme(event.target.value);
				$('renderMap').onclick = ()=>this.handleRenderClick();
				$('mapCriteria').onchange = ()=>this.toggleCustom();
				$('mapRegion').onchange = ()=>this.handleRegionChange();
				// Fase 2 wiring: opacity + landOnly + cache clear
				const op = $('opacitySlider');
				if (op) {
					op.value = this.opacity;
					op.oninput = e=>{ this.opacity = parseInt(e.target.value)||0; this.saveState(); this.applyOpacity(); };
					this.applyOpacity();
				}
				const landCb = $('landOnlyToggle');
				if (landCb) {
					landCb.checked = this.landOnly;
					landCb.onchange = e=>{ this.landOnly = e.target.checked; this.saveState(); if (this.currentImageDataRaw) this.applyFiltersAndRedraw(); };
				}
				const clr = $('clearCacheBtn');
				if (clr) clr.onclick = ()=>{ this.renderCache.clear(); this.updateCacheUI(false); $('mapStatus').textContent = this.string('done'); clr.blur(); };
				// Garis kontur ala KHGT
				const lm = $('lineModeToggle');
				if (lm) {
					lm.checked = this.lineMode;
					lm.onchange = e=>{ this.lineMode = e.target.checked; this.saveState(); if (this.currentImageDataRaw) this.applyFiltersAndRedraw(); };
				}
				const lw = $('lineWidthSlider');
				if (lw) {
					lw.value = this.lineWidth;
					const lvw=$('lineWidthValue'); if (lvw) lvw.textContent = this.lineWidth + 'px';
					lw.oninput = e=>{ this.lineWidth = parseFloat(e.target.value)||2; if (lvw) lvw.textContent = this.lineWidth + 'px'; this.saveState(); if (this.currentImageDataRaw) this.applyFiltersAndRedraw(); };
				}
				$('tabMap').onclick = ()=>this.switchTab("map");
				$('tabCalc').onclick = ()=>this.switchTab("calc");
				$('calcCriteria').onchange = ()=>this.toggleCustomCalc();
				$('calculateBtn').onclick = ()=>this.calculateDetails();
				$('getLocation').onclick = ()=>this.getCurrentLocation();

				// Zoom and pan setup
				this.scale = 1;
				this.translateX = 0;
				this.translateY = 0;
				this.isDragging = false;
				this.startX = 0;
				this.startY = 0;

				$('zoom-in').onclick = ()=>this.zoom(1.2);
				$('zoom-out').onclick = ()=>this.zoom(0.8);
				$('zoom-reset').onclick = ()=>this.resetZoom();

				$('map-container').addEventListener('wheel',(e)=>{
					e.preventDefault();
					const delta = e.deltaY > 0 ? 0.9 : 1.1;
					this.zoom(delta);
				});

				$('map-container').addEventListener('mousedown',(e)=>{
					this.isDragging = true;
					this.startX = e.clientX - this.translateX;
					this.startY = e.clientY - this.translateY;
				});

				$('map-container').addEventListener('mousemove',e=>{
					if (this.isDragging) {
						this.translateX = e.clientX - this.startX;
						this.translateY = e.clientY - this.startY;
						this.limitPan();
						this.updateTransform();
						return;
					}
					// garis kontur tooltip (hanya saat tidak drag)
					if (this.lineMode && this.contourSegments.length) this.handleHover(e);
				});

				$('map-container').addEventListener('mouseup',()=>{
					this.isDragging = false;
				});

				$('map-container').addEventListener('mouseleave',()=>{
					this.isDragging = false;
					this.hideTooltip();
				});

				const today = new Date();
				// Use local YYYY-MM-DD instead of valueAsDate to avoid UTC timezone off-by-one errors
				const formattedDate = `${String(today.getFullYear()).padStart(4, '0')}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
				$('mapDate').value = formattedDate;
				$('calcDate').value = formattedDate;

				// Setup canvas overlay
				const canvas = $('map-overlay');
				const img = $('map-image');

				img.onload = ()=>{
					canvas.width = img.naturalWidth;
					canvas.height = img.naturalHeight;
					this.redrawOverlay();
				};

				window.addEventListener('resize',()=>{
					this.redrawOverlay();
				});

				// Fase 2: load land mask async (non-blocking)
				this.loadLandMask();
				// Initialize to world view
				this.handleRegionChange();
			}

			limitPan() {
				const container = $('map-container');
				const wrapper = $('map-wrapper');
				const containerWidth = container.offsetWidth;
				const containerHeight = container.offsetHeight;
				const scaledWidth = containerWidth * this.scale;
				const scaledHeight = containerHeight * this.scale;

				// Limit horizontal pan
				const maxX = (scaledWidth - containerWidth) / 2;
				const minX = -maxX;
				this.translateX = Math.max(minX, Math.min(maxX, this.translateX));

				// Limit vertical pan
				const maxY = (scaledHeight - containerHeight) / 2;
				const minY = -maxY;
				this.translateY = Math.max(minY, Math.min(maxY, this.translateY));
			}

			zoom(factor) {
				this.scale = Math.max(0.5, Math.min(5, this.scale * factor));
				this.limitPan();
				this.updateTransform();
			}

			resetZoom() {
				this.scale = 1;
				this.translateX = 0;
				this.translateY = 0;
				this.updateTransform();
			}

			updateTransform() {
				$('map-wrapper').style.transform =
					`translate(-50%, -50%) translate(${this.translateX}px, ${this.translateY}px) scale(${this.scale})`;
			}
			// garis kontur tooltip helpers
			handleHover(e) {
				const container = $('map-container');
				const rect = container.getBoundingClientRect();
				const cx = e.clientX - rect.left;
				const cy = e.clientY - rect.top;
				// find nearest contour segment
				let best = null, bestDist = Infinity;
				for (const seg of this.contourSegments) {
					const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
					const len2 = dx*dx + dy*dy || 1;
					let t = ((cx - seg.x1)*dx + (cy - seg.y1)*dy) / len2;
					t = Math.max(0, Math.min(1, t));
					const px = seg.x1 + t*dx, py = seg.y1 + t*dy;
					const d = Math.hypot(cx - px, cy - py);
					if (d < bestDist) { bestDist = d; best = {px, py, lat: seg.lat, lon: seg.lon, d}; }
				}
				const tt = $('mapTooltip');
				if (!tt) return;
				if (best && bestDist < 16) {
					tt.textContent = `${best.lat.toFixed(2)}°, ${best.lon.toFixed(2)}° — ${this.string('tooltipVisible') || 'Visible'}`;
					tt.style.left = (best.px + 12) + 'px';
					tt.style.top = (best.py - 10) + 'px';
					tt.classList.add('show');
					// flip if near edge
					if (best.px > rect.width - 140) tt.style.left = (best.px - tt.offsetWidth - 12) + 'px';
				} else {
					this.hideTooltip();
				}
			}
			hideTooltip() {
				const tt=$('mapTooltip'); if (tt) tt.classList.remove('show');
			}

			string(key) { return text[this.language]?.[key] ?? key; }

			theme(themeName) {
				this.themeName = AppSettings.applyTheme(themeName);
				this.saveState();
			}

			lang(language) {
				this.language = AppSettings.applyLang(language);
				this.saveState();
				Object.keys(text.en).forEach(key=>{ const el = $(key); if (el) el.textContent = this.string(key); });
				// Fase 2 + garis: translate new overlay controls
				const extraKeys = ['opacityLabel','landOnlyLabel','landOnlyHint','lineModeLabel','lineModeHint','lineWidthLabel','clearCache'];
				extraKeys.forEach(k=>{ const el=$(k); if(el) el.textContent = this.string(k); });
				['In', 'Out', 'Reset'].forEach(k => {
					const s = this.string("zoom" + k);
					const el = $('zoom-' + k.toLowerCase());
					if (el) { el.title = s; el.setAttribute("aria-label", s); }
				});
				const calcUtcOffset = $('calcUtcOffset'); if (calcUtcOffset) calcUtcOffset.placeholder = this.string("utcPlaceholder");
				const calcLat = $('calcLat'); if (calcLat) calcLat.placeholder = this.string("placeholderLat");
				const calcLon = $('calcLon'); if (calcLon) calcLon.placeholder = this.string("placeholderLon");

				const translateOptions = (selectId,prefix)=>{
					[...$(selectId).options].forEach(option=>{
						const val = option.value;
						const key = prefix + val.charAt(0).toUpperCase() + val.slice(1);
						const translated = this.string(key);
						if (translated !== key) option.textContent = translated;
					});
				};
				translateOptions('mapRegion', 'region');
				translateOptions('mapCriteria', 'criteria');
				translateOptions('calcCriteria', 'criteria');
				// refresh cache ui language if visible
				if (this.renderCache && this.renderCache.size>0) this.updateCacheUI(false);
			}

			toggleCustom() {
				const isCustom = $('mapCriteria').value === "custom";
				$('customCriteriaInputs').classList.toggle("hidden", !isCustom);
			}

			toggleCustomCalc() {
				const isCustom = $('calcCriteria').value === "custom";
				$('calcCustomCriteriaInputs').classList.toggle("hidden", !isCustom);
			}

			switchTab(tab) {
				if (tab === "map") {
					$('tabMap').classList.add("active");
					$('tabMap').setAttribute("aria-selected", "true");
					$('tabCalc').classList.remove("active");
					$('tabCalc').setAttribute("aria-selected", "false");
					$('mapView').classList.remove("hidden");
					$('calcView').classList.add("hidden");
				} else {
					$('tabMap').classList.remove("active");
					$('tabMap').setAttribute("aria-selected", "false");
					$('tabCalc').classList.add("active");
					$('tabCalc').setAttribute("aria-selected", "true");
					$('mapView').classList.add("hidden");
					$('calcView').classList.remove("hidden");
				}
			}

			getCurrentLocation() {
				const button = $('getLocation');
				const originalText = button.innerHTML;

				button.disabled = true;
				button.innerHTML = `<span class="spinner"></span> ${this.string("locating")}`;

				if (navigator.geolocation) {
					navigator.geolocation.getCurrentPosition(
						p => {
							$('calcLat').value = p.coords.latitude.toFixed(4);
							$('calcLon').value = p.coords.longitude.toFixed(4);
							$('calcUtcOffset').value = Math.round(p.coords.longitude / 15);
							button.disabled = false;
							button.innerHTML = originalText;
						},
						e => {
							alert(this.string("errorLocation") + e.message);
							button.disabled = false;
							button.innerHTML = originalText;
						}
					);
				} else {
					alert(this.string("errorGeo"));
					button.disabled = false;
					button.innerHTML = originalText;
				}
			}

			calculateDetails() {
				const latitude = parseFloat($('calcLat').value);
				const longitude = parseFloat($('calcLon').value);
				const dateString = $('calcDate').value;
				const criteria = $('calcCriteria').value;
				if (isNaN(latitude) || isNaN(longitude) || !dateString) alert(this.string("errorFill"));
				else this.calculateDetailsInner(latitude, longitude, dateString, criteria);
			}

			calculateDetailsInner(latitude, longitude, dateString, criteria) {
				const dateObj = new Date(dateString + "T12:00:00Z");
				const observer = new Astronomy.Observer(latitude, longitude, 0);
				const date = Astronomy.MakeTime(dateObj);
				// Adjust start time to approximate local noon
				const startUT = date.ut - (longitude / 15 / 24);
				const sunset = Astronomy.SearchRiseSet(Astronomy.Body.Sun, observer, -1, startUT, 1);
				if (!sunset) {
					$('results').innerHTML = `<div class="result-card">${this.string("errorSun")}</div>`;
					return;
				}
				this.calculateDetailsWithSunset(sunset, observer, date, criteria);
			}

			calculateDetailsWithSunset(sunset,observer,date,criteria) {
				const sunsetUT = sunset.ut;
				const isGICDetail = criteria === "gic";
				let moonEq, sunEq;
				if (isGICDetail) {
					const mVecJ = Astronomy.GeoVector(Astronomy.Body.Moon, sunsetUT, true);
					const sVecJ = Astronomy.GeoVector(Astronomy.Body.Sun, sunsetUT, true);
					const rot = Astronomy.Rotation_EQJ_EQD(sunsetUT);
					moonEq = Astronomy.EquatorFromVector(Astronomy.RotateVector(rot, mVecJ));
					sunEq = Astronomy.EquatorFromVector(Astronomy.RotateVector(rot, sVecJ));
				} else {
					moonEq = Astronomy.Equator(Astronomy.Body.Moon,sunsetUT,observer,true,true);
					sunEq = Astronomy.Equator(Astronomy.Body.Sun,sunsetUT,observer,true,true);
				}
				const moonHor = Astronomy.Horizon(sunsetUT,observer,moonEq.ra,moonEq.dec,"normal");
				const elongation = Astronomy.AngleBetween(sunEq.vec,moonEq.vec);

				const prevNewMoon = Astronomy.SearchMoonPhase(0,date.ut,-1);
				const ageInDays = prevNewMoon ? (sunsetUT - prevNewMoon.ut) : 0;
				const moonPhase = Astronomy.Illumination(Astronomy.Body.Moon,sunsetUT);
				const moonset = Astronomy.SearchRiseSet(Astronomy.Body.Moon,observer,-1,sunsetUT,1);

				const offset = parseFloat($('calcUtcOffset').value) || 0;

				const formatTime = ut => {
					if (!ut) return "N/A";
					const d = new Date(ut.date);
					d.setMinutes(d.getMinutes() + offset * 60);
					const timeString = d.toISOString().substring(11,19);
					const sign = offset >= 0 ? "+" : "";
					return `${timeString} (UTC${sign}${offset})`;
				};

				let minAlt, minElong, isGICInner;
				if (criteria === "mabbims") {
					minAlt = 3; minElong = 6.4; isGICInner = false;
				} else if (criteria === "gic") {
					minAlt = 5; minElong = 8; isGICInner = true;
				} else if (criteria === "global") {
					minAlt = 0; minElong = 0; isGICInner = false;
				} else if (criteria === "alt0") {
					minAlt = 0; minElong = -100; isGICInner = false;
				} else {
					minAlt = parseFloat($('calcMinAlt').value) || 0;
					minElong = parseFloat($('calcMinElong').value) || 0;
					isGICInner = false;
				}

				let isBeforeDeadline = true;
				if (isGICInner) {
					const nzObs = new Astronomy.Observer(-41.28, 174.77, 0);
					const fajrNZ = Astronomy.SearchAltitude(Astronomy.Body.Sun, nzObs, 1, date, 2.0, -18.0);
					isBeforeDeadline = fajrNZ ? sunsetUT < fajrNZ.ut : false;
				}

				const visible = (isBeforeDeadline && moonHor.altitude >= minAlt && elongation >= minElong);

				const displayData = [
					{label:"visibilityStatus",value:visible ? this.string("visible") : this.string("notVisible"),color:visible ? "var(--success)" : "var(--danger)"},
					{label:"sunsetTime",value:formatTime(sunset)},
					{label:"moonsetTime",value:formatTime(moonset)},
					{label:"moonAlt",value:moonHor.altitude.toFixed(2) + "°"},
					{label:"moonElong",value:elongation.toFixed(2) + "°"},
					{label:"moonAzimuth",value:moonHor.azimuth.toFixed(2) + "°"},
					{label:"moonAge",value:ageInDays.toFixed(2) + " " + this.string("unitDays")},
					{label:"illuminatedFraction",value:(moonPhase.phase_fraction * 100).toFixed(2) + "%"}
				];

				$('results').innerHTML = displayData
					.map(item => `<div class="result-card"><div class="result-label">${this.string(item.label) || item.label}</div><div class="result-value" style="${item.color ? `color:${item.color}` : ""}">${item.value}</div></div>`)
					.join("");
			}

			handleRegionChange() {
				const region = $('mapRegion').value;

				// Map bounds are 90°N to 90°S, -180° to 180°
				const mapBounds = { minLat: -90, maxLat: 90, minLon: -180, maxLon: 180 };

				if (region === "indonesia") {
					// Indonesia region: -11° to 6° lat, 95° to 141° lon
					const targetBounds = { minLat: -11, maxLat: 6, minLon: 95, maxLon: 141 };
					this.zoomToBounds(targetBounds, mapBounds);
				} else {
					// World view
					this.resetZoom();
				}
			}

			zoomToBounds(targetBounds, mapBounds) {
				const container = $('map-container');
				const containerWidth = container.offsetWidth;
				const containerHeight = container.offsetHeight;

				// Calculate how much of the map the target occupies
				const latRange = mapBounds.maxLat - mapBounds.minLat;
				const lonRange = mapBounds.maxLon - mapBounds.minLon;
				const targetLatRange = targetBounds.maxLat - targetBounds.minLat;
				const targetLonRange = targetBounds.maxLon - targetBounds.minLon;

				// Calculate required scale to fit target region
				const scaleX = lonRange / targetLonRange;
				const scaleY = latRange / targetLatRange;
				this.scale = Math.min(scaleX, scaleY, 5); // Cap at max zoom

				// Calculate center of target region in normalized coordinates [0,1]
				const centerLon = (targetBounds.minLon + targetBounds.maxLon) / 2;
				const centerLat = (targetBounds.minLat + targetBounds.maxLat) / 2;

				// Convert to normalized position on map [0,1]
				const normX = (centerLon - mapBounds.minLon) / lonRange;
				const normY = (mapBounds.maxLat - centerLat) / latRange;

				// Calculate translation needed to center this point
				// Since map is centered, we need to offset from center
				this.translateX = -(normX - 0.5) * containerWidth * this.scale;
				this.translateY = -(normY - 0.5) * containerHeight * this.scale;

				this.limitPan();
				this.updateTransform();
			}

			handleRenderClick() {
				this.isRendering ? this.cancelRender() : this.startRender();
			}

			cancelRender() {
				if (this.worker) {
					this.worker.terminate();
					this.worker = null;
				}
				this.isRendering = false;
				$('renderMap').disabled = false;
				$('renderMap').textContent = this.string("renderMap");
				$('mapStatus').textContent = this.string("cancelled");
			}

			startRender() {
				// Fase 2: cache check before starting worker
				const region = $('mapRegion').value;
				const criteria = $('mapCriteria').value;
				const dateString = $('mapDate').value;
				const minAltVal = parseFloat($('minAlt').value) || 0;
				const minElongVal = parseFloat($('minElong').value) || 0;
				const cacheKey = this.getCacheKey(region, criteria, dateString, minAltVal, minElongVal);
				// setup bounds early for cache UI
				let boundsEarly;
				if (region === "indonesia") boundsEarly = { minLat: -11, maxLat: 6, minLon: 95, maxLon: 141 };
				else boundsEarly = { minLat: -90, maxLat: 90, minLon: -180, maxLon: 180 };
				this.lastBounds = boundsEarly;
				const cached = this.renderCache.get(cacheKey);
				if (cached) {
					// cache hit: restore without worker, clone buffer
					this.isRendering = false;
					const clonedBuf = cached.buffer.slice(0);
					this.handleComplete(cached.width, cached.height, clonedBuf, true);
					this.updateCacheUI(true);
					return;
				}
				this.isRendering = true;
				$('renderMap').disabled = false;
				$('renderMap').textContent = this.string("cancel");
				$('mapStatus').innerHTML = `<span class="spinner"></span> ${this.string("calculating")}`;

				// Define bounds based on region (image is 90°N to 90°S)
				let bounds = boundsEarly;

				const dateObj = new Date(dateString ? dateString + "T12:00:00Z" : new Date());
				const widthDeg = bounds.maxLon - bounds.minLon;
				const heightDeg = bounds.maxLat - bounds.minLat;

				const renderParams = {
					bounds: bounds,
					widthDeg: widthDeg,
					heightDeg: heightDeg,
					criteria: criteria,
					dateTimestamp: dateObj.getTime(),
					minAlt: minAltVal,
					minElong: minElongVal
				};
				// store key for completion
				this._pendingKey = cacheKey;
				this._pendingParams = {widthDeg, heightDeg};

				if (!this.worker) {
					const blob = new Blob([WORKER_CODE], { type: 'application/javascript' });
					this.worker = new Worker(URL.createObjectURL(blob));
				}

				this.worker.onmessage = (e)=>{
					const data = e.data;
					if (data.progress) {
						$('mapStatus').innerHTML = `<span class="spinner"></span> ${this.string("calculating")} ${data.progress}%`;
					} else if (data.buffer) {
						this.handleComplete(data.width, data.height, data.buffer, false);
					} else if (data.error) {
						console.error(data.error);
						$('mapStatus').textContent = "Error: " + data.error;
						this.cancelRender();
					}
				};
				this.worker.postMessage(renderParams);
			}

			handleComplete(width, height, buffer, fromCache=false) {
				// store raw unfiltered for land toggle
				const raw = new Uint8ClampedArray(buffer);
				this.currentImageDataRaw = {width, height, buffer: raw.buffer.slice(0), raw: raw};
				// Fase 2: save to cache if not from cache
				if (!fromCache && this._pendingKey) {
					this.renderCache.set(this._pendingKey, {width, height, buffer: raw.buffer.slice(0)});
					// limit cache size to 12 entries (LRU via insertion order)
					if (this.renderCache.size > 12) {
						const firstKey = this.renderCache.keys().next().value;
						this.renderCache.delete(firstKey);
					}
				}
				this._pendingKey = null;
				this.applyFiltersAndRedraw();
				this.isRendering = false;
				$('renderMap').disabled = false;
				$('renderMap').textContent = this.string("renderMap");
				$('mapStatus').textContent = this.string("done");
				if (fromCache) this.updateCacheUI(true); else this.updateCacheUI(false);
			}
			applyFiltersAndRedraw() {
				if (!this.currentImageDataRaw || !this.lastBounds) return;
				let {width, height, raw} = this.currentImageDataRaw;
				// clone for filtering
				let filtered = new Uint8ClampedArray(raw);
				if (this.landOnly) {
					// per-pixel land check
					const bounds = this.lastBounds;
					const wDeg = bounds.maxLon - bounds.minLon;
					const hDeg = bounds.maxLat - bounds.minLat;
					const cellW = wDeg / width;
					const cellH = hDeg / height;
					for (let r=0; r<height; r++) {
						const lat = bounds.maxLat - (r + 0.5) * cellH;
						for (let c=0;c<width;c++) {
							const lon = bounds.minLon + (c + 0.5) * cellW;
							const idx = (r*width + c)*4 + 3; // alpha
							if (filtered[idx] > 0) {
								// visible pixel: hide if over ocean
								if (!this.isLand(lat, lon, 0.25)) filtered[idx]=0;
							}
						}
					}
				}
				this.currentImageData = new ImageData(filtered, width, height);
				this.redrawOverlay();
			}

			latToPlateCarreeY(lat) {
				return lat;
			}

			redrawOverlay() {
				if (!this.currentImageDataRaw || !this.lastBounds) return;
				const canvas = $('map-overlay');
				const img = $('map-image');
				// Set canvas to match image dimensions (image may not be loaded yet)
				canvas.width = img.naturalWidth || img.width || canvas.clientWidth || 1200;
				canvas.height = img.naturalHeight || img.height || canvas.clientHeight || 600;
				if (!canvas.width || !canvas.height) return;
				const ctx = canvas.getContext("2d");
				ctx.clearRect(0, 0, canvas.width, canvas.height);
				// hide previous marker/label
				const mk=$('mapMarker'), cl=$('contourLabel');
				if (mk) mk.classList.add('hidden');
				if (cl) cl.classList.add('hidden');
				this.contourSegments = [];
				this.markerPos = null;
				// common geo transform
				const imgBounds = { minLat: -90, maxLat: 90, minLon: -180, maxLon: 180 };
				const dataBounds = this.lastBounds;
				const x = ((dataBounds.minLon - imgBounds.minLon) / (imgBounds.maxLon - imgBounds.minLon)) * canvas.width;
				const w = ((dataBounds.maxLon - dataBounds.minLon) / (imgBounds.maxLon - imgBounds.minLon)) * canvas.width;
				const mapTopY = this.latToPlateCarreeY(imgBounds.maxLat);
				const mapBottomY = this.latToPlateCarreeY(imgBounds.minLat);
				const dataTopY = this.latToPlateCarreeY(dataBounds.maxLat);
				const dataBottomY = this.latToPlateCarreeY(dataBounds.minLat);
				const y = ((mapTopY - dataTopY) / (mapTopY - mapBottomY)) * canvas.height;
				const h = ((mapTopY - dataBottomY) / (mapTopY - mapBottomY)) * canvas.height - y;

				if (!this.lineMode) {
					// === SHADING MODE (Fase 2) ===
					if (!this.currentImageData) return;
					ctx.imageSmoothingEnabled = true;
					ctx.imageSmoothingQuality = 'high';
					const tempCanvas = document.createElement('canvas');
					tempCanvas.width = this.currentImageData.width;
					tempCanvas.height = this.currentImageData.height;
					const tempCtx = tempCanvas.getContext('2d');
					tempCtx.imageSmoothingEnabled = true;
					tempCtx.putImageData(this.currentImageData, 0, 0);
					ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, x, y, w, h);
					canvas.style.opacity = (this.opacity/100).toString();
					return;
				}
				// === GARIS KONTOUR MODE (ala KHGT) ===
				const raw = this.currentImageDataRaw.raw;
				const width = this.currentImageDataRaw.width;
				const height = this.currentImageDataRaw.height;
				const criteria = $('mapCriteria').value;
				const color = this.getContourColor(criteria);
				// build visibility boolean grid
				const visible = new Uint8Array(width*height);
				for (let i=0;i<width*height;i++) visible[i] = raw[i*4+3] > 0 ? 1 : 0;
				// land filter for line segments: if landOnly, we will skip ocean mid-points later
				// prepare transform from grid to canvas overlay coords (pre-wrapper)
				const gridToCanvas = (gx, gy) => {
					return { x: x + (gx / width) * w, y: y + (gy / height) * h };
				};
				// collect boundary edges: for each visible cell, check right & bottom neighbors + outer border
				const segments = [];
				const boundsW = dataBounds.maxLon - dataBounds.minLon;
				const boundsH = dataBounds.maxLat - dataBounds.minLat;
				for (let r=0;r<height;r++) {
					for (let c=0;c<width;c++) {
						const idx = r*width + c;
						if (!visible[idx]) continue;
						const lat = dataBounds.maxLat - (r + 0.5)/height * boundsH;
						const lon = dataBounds.minLon + (c + 0.5)/width * boundsW;
						// helper to add edge if neighbor not visible or out of bounds
						const addEdge = (x1,y1,x2,y2, midLat, midLon) => {
							// landOnly check: skip if middle point over ocean
							if (this.landOnly && !this.isLand(midLat, midLon, 0.2)) return;
							const p1 = gridToCanvas(x1, y1);
							const p2 = gridToCanvas(x2, y2);
							segments.push({x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, lat, lon});
						};
						// right edge
						if (c===width-1 || !visible[idx+1]) {
							const midLat = lat;
							const midLon = dataBounds.minLon + (c+1)/width * boundsW;
							addEdge(c+1, r, c+1, r+1, midLat, midLon);
						}
						// bottom edge
						if (r===height-1 || !visible[idx+width]) {
							const midLat = dataBounds.maxLat - (r+1)/height * boundsH;
							const midLon = lon;
							addEdge(c, r+1, c+1, r+1, midLat, midLon);
						}
						// left edge for first column visible (outer border)
						if (c===0) {
							const midLat = lat;
							const midLon = dataBounds.minLon;
							if (visible[idx]) addEdge(c, r, c, r+1, midLat, midLon);
						}
						if (r===0) {
							const midLat = dataBounds.maxLat;
							const midLon = lon;
							addEdge(c, r, c+1, r, midLat, midLon);
						}
					}
				}
				// if no visible, show empty but still opacity
				if (!segments.length) {
					canvas.style.opacity = (this.opacity/100).toString();
					this.contourSegments = [];
					return;
				}
				// draw all segments as one path with smoothing
				ctx.save();
				ctx.strokeStyle = color;
				ctx.lineWidth = this.lineWidth;
				ctx.lineJoin = 'round';
				ctx.lineCap = 'round';
				ctx.globalAlpha = (this.opacity/100) * 0.95 + 0.05; // keep visible even at low opacity
				ctx.beginPath();
				for (const s of segments) {
					ctx.moveTo(s.x1, s.y1);
					ctx.lineTo(s.x2, s.y2);
				}
				ctx.stroke();
				// add glow for readability on light/dark basemap
				ctx.globalAlpha = 0.25 * (this.opacity/100);
				ctx.lineWidth = this.lineWidth + 3;
				ctx.strokeStyle = '#fff';
				ctx.stroke();
				// re-stroke main line on top
				ctx.globalAlpha = (this.opacity/100);
				ctx.lineWidth = this.lineWidth;
				ctx.strokeStyle = color;
				ctx.beginPath();
				for (const s of segments) { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }
				ctx.stroke();
				ctx.restore();
				canvas.style.opacity = '1'; // opacity handled via globalAlpha
				// store for hover: need to convert segments to container pixel space (already overlay canvas space; handleHover uses container rect which matches overlay canvas size because overlay covers wrapper which is 100% of container after transform? For simplicity, store same and handleHover will map client to overlay by scaling rect to canvas size.)
				// container rect to canvas ratio:
				const container = $('map-container');
				const rect = container.getBoundingClientRect();
				const scaleX = rect.width / canvas.width;
				const scaleY = rect.height / canvas.height;
				this.contourSegments = segments.map(s=>({
					x1: s.x1 * scaleX, y1: s.y1 * scaleY, x2: s.x2 * scaleX, y2: s.y2 * scaleY, lat: s.lat, lon: s.lon
				}));
				// marker: first visible point (sentroid of visible boundary for 'semua' detail)
				// compute centroid of all visible boundary cells
				let sumLat=0, sumLon=0, cnt=0;
				for (let r=0;r<height;r++) for (let c=0;c<width;c++) if (visible[r*width+c]) { sumLat += dataBounds.maxLat - (r+0.5)/height*boundsH; sumLon += dataBounds.minLon + (c+0.5)/width*boundsW; cnt++; }
				if (cnt>0) {
					const cenLat = sumLat/cnt, cenLon = sumLon/cnt;
					// find boundary cell closest to centroid for marker (more meaningful than random)
					let bestD=Infinity, best=null;
					for (let r=0;r<height;r++) for (let c=0;c<width;c++) if (visible[r*width+c]) {
						const lat = dataBounds.maxLat - (r+0.5)/height*boundsH, lon = dataBounds.minLon + (c+0.5)/width*boundsW;
						const isB = (c===0 || c===width-1 || r===0 || r===height-1 || !visible[r*width+c+1] || !visible[r*width+c-1] || !visible[(r-1)*width+c] || !visible[(r+1)*width+c]);
						if (!isB) continue;
						const d = Math.hypot(lat-cenLat, lon-cenLon);
						if (d<bestD) {bestD=d; best={lat,lon};}
					}
					if (best) {
						const cx = x + (best.lon - dataBounds.minLon)/boundsW * w;
						const cy = y + (dataBounds.maxLat - best.lat)/boundsH * h;
						this.markerPos = {lat:best.lat, lon:best.lon, x:cx*scaleX, y:cy*scaleY, cx, cy};
						// place marker div (position inside wrapper: use % of canvas)
						if (mk) {
							mk.style.left = (cx / canvas.width * 100) + '%';
							mk.style.top = (cy / canvas.height * 100) + '%';
							mk.classList.remove('hidden');
							mk.title = `${this.string('firstVisible')}: ${best.lat.toFixed(2)}°, ${best.lon.toFixed(2)}°`;
						}
						if (cl) {
							cl.textContent = criteria==='mabbims' ? 'MABBIMS 3°/6.4°' : criteria==='gic' ? 'KHGT 5°/8°' : criteria;
							cl.style.left = (cx / canvas.width * 100) + '%';
							cl.style.top = ((cy / canvas.height * 100) - 3) + '%';
							cl.classList.remove('hidden');
						}
					}
				}
			}
		}
		new HilalMap();
	</script>
</body>
</html>
